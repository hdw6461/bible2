<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --base-font-size: 1.125rem;
        }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0f14 0%, #050505 80%);
            background-attachment: fixed;
            color: #ffffff;
        }
        
        .readable-text {
            font-family: 'Nanum Myeongjo', serif !important;
            word-break: keep-all;
            overflow-wrap: break-word;
            transition: font-size 0.2s ease, line-height 0.2s ease;
        }

        /* 인터뷰 대화 스타일 */
        .interview-speech {
            margin-bottom: 1.8rem;  /* 질문과 답변 사이의 줄간격 (가시성 확보) */
            padding-left: 0.5rem;
            transition: margin 0.2s ease;
        }
        
        /* 각 화자의 발화 블록 */
        .speaker-block {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        /* 이름 스타일: 굵고, 약간의 오른쪽 간격, 인터뷰이/어 구분 색상 */
        .speaker-name {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 1.1em;
            letter-spacing: -0.3px;
            background: rgba(185, 28, 28, 0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            color: #ffb3b3;
            text-shadow: 0 0 2px rgba(0,0,0,0.3);
            margin-right: 0.5rem;   /* 이름과 내용 사이 간격 */
            white-space: nowrap;
        }
        
        /* 인터뷰이(손세미)는 색상 톤을 약간 다르게 (선택적 구분) */
        .speaker-name[data-speaker="손세미"] {
            color: #ff8c8c;
            background: rgba(220, 38, 38, 0.25);
            border-left: 3px solid #ef4444;
        }
        
        /* 내용 텍스트 */
        .speech-content {
            flex: 1;
            line-height: 1.65;
            word-break: keep-all;
        }
        
        /* 일반 문단 (후일담 등) */
        .normal-paragraph {
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px dashed #2c2c2c;
            border-bottom: 1px dashed #2c2c2c;
            color: #cbd5e1;
            font-style: normal;
        }
        
        /* 모바일에서 이름 줄바꿈 방지 */
        @media (max-width: 640px) {
            .speaker-name {
                white-space: normal;
                font-size: 0.9rem;
                padding: 0.15rem 0.6rem;
            }
            .interview-speech {
                margin-bottom: 1.5rem;
            }
        }

        .control-panel {
            background: rgba(30, 30, 35, 0.95);
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .text-size-0 { font-size: 1.0rem !important; }
        .text-size-1 { font-size: 1.15rem !important; }
        .text-size-2 { font-size: 1.3rem !important; }
        .text-size-3 { font-size: 1.5rem !important; }
        .text-size-4 { font-size: 1.75rem !important; }

        .leading-step-0 { line-height: 1.6 !important; }
        .leading-step-1 { line-height: 2.0 !important; }
        .leading-step-2 { line-height: 2.5 !important; }

        .prose h3 {
            font-family: 'Nanum Gothic', sans-serif;
            color: #ffffff !important;
            font-weight: 800;
            border-left: 6px solid #b91c1c;
            padding-left: 1.25rem;
            margin-top: 3rem !important;
            margin-bottom: 1.5rem !important;
        }
        .prose strong {
            color: #ff5555 !important;
            font-weight: 800;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: rgba(185, 28, 28, 0.5);
        }
        .prose hr {
            border-color: #555 !important;
            margin: 4rem 0 !important;
        }

        .comment-divider {
            border-top: 1px solid #333;
            margin: 2rem 0;
            width: 100%;
        }

        .church-prose blockquote {
            border: none !important;
            margin: 1.5rem 0 !important;
            padding: 0 !important;
        }
        
        .comment-thread {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid #444;
            margin-bottom: 1rem;
        }

        .comment-reply {
            position: relative;
            margin-left: 2.5rem;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.25rem;
            border-radius: 12px;
            border-left: 4px solid #b91c1c;
        }

        .comment-reply::before {
            content: "";
            position: absolute;
            left: -1.5rem;
            top: 2rem;
            width: 1.2rem;
            height: 2px;
            background: #b91c1c;
        }

        .author-tag {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 0.9em;
            color: #e5e7eb;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comment-content {
            margin-top: 0.25rem;
            color: #d1d5db;
            line-height: 1.7;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // HTML escape utility
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 인터뷰 텍스트를 가독성 높은 HTML 로 변환 (이름·내용 간격 + 발화 사이 여백)
        function beautifyInterviewText(rawText) {
            if (!rawText) return '';
            const lines = rawText.split(/\r?\n/);
            let resultHtml = [];
            let normalBuffer = [];   // 일반 문장들 (후일담, "인터뷰 후일담" 등)
            
            // 화자 패턴 (장윤영, 손세미 뒤에 콜론과 공백)
            const speakerPattern = /^(장윤영|손세미):\s*(.*)$/;
            
            // flush 일반 텍스트 블록
            const flushNormal = () => {
                if (normalBuffer.length) {
                    const paraText = normalBuffer.join(' ').trim();
                    if (paraText) {
                        resultHtml.push(`<div class="normal-paragraph">${escapeHtml(paraText)}</div>`);
                    }
                    normalBuffer = [];
                }
            };
            
            for (let line of lines) {
                const trimmed = line.trim();
                if (trimmed === '') continue;
                
                const match = trimmed.match(speakerPattern);
                if (match) {
                    // 발화 시작 전에 쌓인 일반 텍스트 플러시
                    flushNormal();
                    
                    const speaker = match[1];
                    let content = match[2].trim();
                    // 내용 내 줄바꿈 보존을 위해 <br> 처리 (긴 대사 안의 개행)
                    if (content) {
                        content = escapeHtml(content).replace(/\n/g, '<br>');
                    }
                    // 인터뷰 발화 블록 생성
                    // 이름과 내용 사이 간격: .speaker-name의 margin-right + gap, 추가로 여백 확보
                    resultHtml.push(`
                        <div class="interview-speech">
                            <div class="speaker-block">
                                <span class="speaker-name" data-speaker="${speaker}">${escapeHtml(speaker)}</span>
                                <span class="speech-content">${content || ''}</span>
                            </div>
                        </div>
                    `);
                } else {
                    // 인터뷰 대사가 아닌 일반 텍스트라면 (예: [인터뷰 후일담] 등)
                    normalBuffer.push(trimmed);
                }
            }
            // 마지막 일반 텍스트 처리
            flushNormal();
            
            return resultHtml.join('');
        }
        
        // Parse church board Markdown format (수정 없이 유지, 기존 방식 + 안정성)
        function parseChurchComments(mdText) {
            const lines = mdText.split('\n');
            const threads = [];
            let currentThread = null;
            let currentComment = null;
            let pendingContent = [];

            function flushComment() {
                if (currentComment && pendingContent.length > 0) {
                    currentComment.content = pendingContent.join('\n').trim();
                    if (currentComment.type === 'top') {
                        currentThread = { top: currentComment, replies: [] };
                        threads.push(currentThread);
                    } else if (currentComment.type === 'reply') {
                        if (currentThread) {
                            currentThread.replies.push(currentComment);
                        } else {
                            threads.push({ top: null, replies: [currentComment] });
                        }
                    }
                    currentComment = null;
                    pendingContent = [];
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                if (trimmed === '') continue;

                const headerMatch = trimmed.match(/^(>{1,2}) \*\*(.+?)\*\* \((.+?)\)$/);
                if (headerMatch) {
                    flushComment();
                    const prefix = headerMatch[1];
                    const nickname = headerMatch[2];
                    const date = headerMatch[3];
                    const type = prefix === '>' ? 'top' : 'reply';
                    currentComment = { type, nickname, date, content: '' };
                    pendingContent = [];
                } else {
                    let contentText = null;
                    if (line.startsWith('>> ')) {
                        contentText = line.substring(3).trim();
                    } else if (line.startsWith('> ')) {
                        contentText = line.substring(2).trim();
                    }
                    if (contentText !== null && currentComment) {
                        pendingContent.push(contentText);
                    }
                }
            }
            flushComment();

            let html = '';
            for (const thread of threads) {
                if (thread.top) {
                    html += `<div class="comment-thread">
                        <div class="author-tag">
                            <i data-lucide="user" class="w-4 h-4"></i> ${escapeHtml(thread.top.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(thread.top.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(thread.top.content).replace(/\n/g, '<br>')}</div>`;
                }
                for (const reply of thread.replies) {
                    html += `<div class="comment-reply">
                        <div class="author-tag">
                            <i data-lucide="user-plus" class="w-4 h-4 text-red-500"></i> ${escapeHtml(reply.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(reply.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                    </div>`;
                }
                if (thread.top) {
                    html += `</div>`;
                }
            }
            return html;
        }

        // 에피소드 데이터 (mainText 인터뷰 포함)
        const episodes = [
            {
                title: "# [1] 그날 예배당에서의 일",
                mainText: `
# [1] 그날 예배당에서의 일

장윤영: 언니, 대체 무슨 일이에요? 지난 몇 년간 연락 한 번 없다가 갑자기 절 찾아와서 이런 얘기를 꺼내다니. 그것도… 2009년 최창환 일에 대해서요? 언니, 아시죠? 그 아이, 교회 애들 사이에서도 좀… 문제가 많았잖아요. 요즘 저도 좀 정신없긴 했지만, 그땐 교회 분위기도 말이 아니었죠.
손세미: (떨리는 목소리로) 윤영아. 난… 네가 이 이야기를 제대로 들어줄 유일한 사람이라고 생각했어. 네가 비록… 조금 문란한 면이 있긴 해도, 적어도 세상의 편견 없이 내가 겪은 일을 있는 그대로 이해해 줄 거라고 믿었다.
장윤영: (피식 웃으며) 문란하다니. 언니는 여전히 그렇게 세상을 단정 짓는군요. 좋습니다. 제가 들은 게 맞다면, 2009년 4월, 흐드러진 벚꽃이 피던 때, 언니가 고등부실에서 그 아이를 기다렸다고요? 대체 왜죠? 단순히 지도 교사로서의 역할이었을까요? 당시 최창환에 대한 소문이 교회에 파다했는데… ‘크고, 강하고, 단단하고…’ 뭐 이런 소문이 언니 귀에도 들어갔을 텐데요.
손세미: (정색하며) 윤영아, 말 조심해. 나는 교사로서 그 아이의 방황을 바로잡아야 할 책임감을 느꼈을 뿐이야. 그 아이를 둘러싼 저급한 소문들은… 내게는 그저 아이의 타락을 보여주는 지표였어. 오히려 내 마음을 더 무겁게 만들었지. 그런 음담패설 같은 것들이 내게 영향을 줄 리가 없잖니. 나는 그저 그 소문이 사실이라면… 우리 창환이가 너무 안타까웠을 뿐이야.
장윤영: 안타까웠다고요? 그런데 그 소문들이 언니의 '상상력을 자극했다'고 스스로 말한 부분은 어떻게 설명할 건데요? '부끄러웠지만 동시에 알 수 없는 이끌림'이라니요. 그리고 지난주에 최창환이 데려왔던 그 ‘여우상 미녀’는요? 165cm의 늘씬한 키에 새하얀 피부. 언니는 그 여학생의 눈빛에서 그들의 '뜨거운 밤'을 읽었다면서요. 정말 단순히 '제자를 걱정하는 교사의 눈'으로만 보인 건가요?

손세미: (흠칫하며) 윤영아, 너는 정말 단어 선택이 늘 그렇게 저속해야겠니? 나는 그저… (한숨) 창환이가 그 시기, 수능 50일을 앞두고 얼마나 큰 압박감에 시달렸겠어. 그 아이의 불안감, 성적 고민, 그 모든 것이 뒤섞인 마지막 '어리광'이라고 생각했어. 교사로서, 그 작은 손길마저 외면할 수는 없었단다.
장윤영: (비웃듯) '어리광'이요? '어리광' 때문에 매일 남학생의 성기를 입에 물고 있었다는 말인가요? 그렇게 매일 은밀하게 붙어 있었으니, 그 애가 언니 몸 깊은 곳까지 닿고 싶어 하는 건 너무나 당연한 수순 아니었을까요? 솔직히 언니도, 그 아이의 '발칙한 심보'를 알면서도 내심 즐겼던 거잖아요.
손세미: (목소리가 떨린다) 즐겼다니… 그건 아니야. 나는 그저… 그의 눈빛이 그날따라 유독 이글거렸고, 그게 내 안까지 스며드는 듯한 느낌은 받았지. 그래, 오피스텔로 가자며 어린아이처럼 떼를 쓸 때, 그 아이가 원하는 게 무엇인지는 분명히 알았어. 하지만 동시에, 그 아이의 절박한 상황이… 내 마음을 움직였던 것도 사실이야.
장윤영: 그래서 '삽입은 절대 안 돼.'라고 선을 그은 건가요? 겉으로는 엄한 표정을 지으며 통통한 뺨을 꼬집어줬다고 했죠? 근데 그 순간에도 창환이는 순진한 척 고개를 끄덕였다고요? 언니는 정말 그 아이가 언니 말을 '경청하는 아이'라고 믿었던 거예요? 아니면 언니 스스로를 속이면서 통제력을 잃지 않았다고 착각하고 싶었던 거구요?
손세미: (애써 침착하려 한다) 나는… 나는 그 아이가 내 말을 지킬 것이라고 믿었어. 그래, 내 인생에서 처음으로 남자를 내 은밀한 안식처로 초대한 것이었지만… (말끝을 흐린다)
장윤영: '은밀한 안식처'라… 남자를 받아들이기 딱 좋은 곳이었네요. 비까지 쏟아졌다면서요? 아주 드라마틱하게 젖을 수 있었겠네요. 그래서 둘이 같이 샤워실로 들어갔다는 거죠? 언니, 그때 언니 심정이 어땠어요? '아니야, 이건 교사로서 적절치 않아' 하는 이성적인 생각보다, 혹시… 다른 뭔가가 가슴을 간지럽히지 않았나요?
손세미: (시선을 회피하며) 처음엔 망설였어. 하지만… 땀과 빗물에 젖은 아이를 그대로 둘 수도 없었고, 나 또한 비에 젖어 한기가 들었으니… 그리고 이미 그 아이 앞에서 오랄까지 해준 마당에, 이제 와서 따로 씻는다는 건 너무나 우스꽝스러운 일이었어. (점점 솔직해진다) 샤워실 안으로 들어가려는데… 왠지 모를… 흥분감이… 밀려왔던 것 같아.
장윤영: (비릿하게 웃으며) 흥분감이라… 숨겨왔던 언니의 진실이 한 겹 두 겹 벗겨지면서 '알몸'이 드러나는 순간, 그 아이의 시선이 언니 몸을 훑어내릴 때, 특히 언니의 '은밀한 숲이 시작되는 둔덕 라인'에 유심히 머무는 걸 느꼈을 때요. 그때 정말 '얼굴이 화끈거렸지만 한편으로는 누군가의 '여신'이 된 것 같은 묘한 뿌듯함이 가슴 깊은 곳을 간지럽혔다'고 했잖아요. 그 '묘한 뿌듯함'이 언니의 진짜 욕망 아니었을까요? 평소의 언니답지 않은 몸매에 대한 칭찬을 갈구했던 것 말이에요.
손세미: (얼굴이 붉어진다) …그래, 인정할게. 그 아이가 '선생님, 정말 아름다워요. 제가 본 그 어떤 것보다도요'라고 말했을 때… 가슴이 쿵 하고 내려앉는 것 같았어. 누군가에게 그렇게… 노골적으로 숭배받는 느낌은 처음이었지. 나는 애써 아무렇지도 않은 척, 샤워볼에 거품을 내어 그의 단단한 몸을 닦아줬어. 그의 탄탄한 어깨와 팔, 앳된 소년의 허벅지에 내 손길이 닿을 때마다… 뜨거운 열기가 전해지는 듯했어. 그건… 교사로서의 감정이라고만은 할 수 없었어.
장윤영: 그럼요, 그럴 수 없었겠죠. 그때 그 아이가 언니를 뒤에서 끌어안고, 거품 묻은 몸을 언니 가슴과 배에 비비기 시작했을 때, 그리고 그의 굵고 단단한 실체가 언니 맨 엉덩이에 직접 닿아 비벼질 때요. 그때 언니 몸은 솔직하게 반응했겠죠? '묵직한 압박감과 함께 알 수 없는 전율이 제 허리를 타고 올랐다'고 표현했잖아요.
손세미: (고개를 떨군다) …그래. 그 아이가 내 가슴을 만지작거리며 삽입을 간절히 졸랐을 때, 나는 단호하게 '안 돼, 창환아. 그건 선생님이 지켜야 할 마지막 선이야'라고 말했지만… 사실 내 몸은 이미 거짓말을 하고 있었어. 내 은밀한 곳에선 이미 부끄러운 액체가 울컥 쏟아져 나오고 있었단다. 마치 갈증 난 생명체처럼, 내 안의 구멍은 뻐끔거리며 그 아이의 침입을 갈구하고 있었어. 이성으로는 막아섰지만, 내 몸은… 그 아이를 향해 활짝 열리고 있었던 거야.
장윤영: (잠시 침묵하더니) 결국, 언니가 정한 '선'은… 그렇게 허무하게 무너진 거네요. 비록 그 아이가 언니 안에 들어가지 못했을 뿐, 언니의 욕망은 이미 그 아이를 받아들이고 있었던 거잖아요. 그리고 그 아이가 언니 엉덩이에 모든 걸 쏟아냈을 때, 언니는 어떤 생각을 했어요? '조금만 늦었더라면, 내가 먼저 그 아이에게 나를 가져달라고 애걸했을지도 모르겠다는 무서운 생각이 들었다'고 했죠? 그건… 후회인가요? 아니면 또 다른 종류의 갈망이었을까요?
손세미: (눈을 감는다) …무서운 생각이었어. 내가… 내가 그 아이에게 간절히 원했을지도 모른다는 사실이… 그리고 절정에 이르지 못했다는 아쉬움에, 나도 모르게 그 아이의 품에 더욱 깊이 안겼던 것도… 인정해. 그건… 갈망이었을 거야. 내가 미처 깨닫지 못했던, 내 안에 숨겨진… 무언가에 대한.

[인터뷰 후일담]
윤영이의 날카로운 질문들은 늘 나를 불편하게 했지만, 역설적이게도 가장 솔직한 나를 마주하게 만들었다. 그녀의 비아냥거림 속에서도, 나는 2009년 그 어린 창환이와의 순간들이 단순한 교사의 연민이나 일탈이 아니었음을 깨달았다. 처음에는 '어리광'으로 치부하며 나 자신을 설득했지만, 창환이가 내 몸에 닿을 때마다 느껴지던 뜨거운 열기와, 샤워실에서 벌거벗은 나를 숭배하듯 바라보던 그의 눈빛 속에서, 나는 태어나서 처음으로 '여인'으로서 온전히 욕망받고 있음을 느꼈다. 그가 내 맨 엉덩이에 자신의 것을 비벼댈 때 터져 나오던 내 몸의 솔직한 반응, 그리고 삽입을 막으면서도 내 안의 구멍이 그의 침입을 갈구했던 그 본능적인 목마름은… 이성으로는 도저히 부정할 수 없는 진실이었다. 나는 그 아이를 '사랑'했는지도 모른다. 스승과 제자라는 금기를 넘어선 육체적 이끌림과, 나를 '여신'으로 만들어준 그 아이의 순수한 열망이 뒤섞여, 내 안의 가장 깊고 은밀한 곳에서 진실한 '사랑'과도 같은 감정을 피워냈던 건지도… 절정에 이르지 못한 아쉬움에 그의 품에 더 깊이 안겼던 그 순간, 내 몸은 이미 그 아이를 사랑하고 있었다고, 이제는 인정할 수 있을 것 같다. 비록 그의 젊음과 나의 억압된 욕망이 빚어낸 한여름 밤의 꿈이었을지라도, 그 순간만큼은 온전한 감정이었음을.

            });

            const sizeLabel = sizeLabels[sizeLevel];
            const leadingLabel = leadingLabels[leadingLevel];
            
            document.getElementById('size-indicator').textContent = sizeLabel;
            document.getElementById('leading-indicator').textContent = leadingLabel;
            
            if (document.getElementById('size-indicator-mobile')) {
                document.getElementById('size-indicator-mobile').textContent = sizeLabel;
                document.getElementById('leading-indicator-mobile').textContent = leadingLabel;
            }
        }

        function updateSize(step) {
            sizeLevel = Math.max(0, Math.min(4, sizeLevel + step));
            updateTypography();
        }

        function updateLeading(step) {
            leadingLevel = Math.max(0, Math.min(2, leadingLevel + step));
            updateTypography();
        }

        function toggleMobileControls() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function render() {
            const ep = episodes[currentIndex];
            document.getElementById('post-title').textContent = ep.title;
            
            // 인터뷰 텍스트를 전용 가독성 포맷으로 렌더링 (이름 간격 + 발화 줄간격)
            const formattedInterview = beautifyInterviewText(ep.mainText);
            document.getElementById('main-text').innerHTML = formattedInterview;
            
            // Cafe comments 는 마크다운 파싱 (기존 방식 유지)
            const cafeHtml = marked.parse(ep.cafeComments, { breaks: true })
                .replace(/<hr>/g, '<div class="comment-divider"></div>');
            document.getElementById('cafe-comments').innerHTML = cafeHtml;
            
            // Church comments
            document.getElementById('church-comments').innerHTML = parseChurchComments(ep.churchComments);
            
            document.getElementById('page-indicator').textContent = `${currentIndex + 1} / ${episodes.length}`;
            
            document.getElementById('btn-prev').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next').style.visibility = currentIndex === episodes.length - 1 ? 'hidden' : 'visible';

            lucide.createIcons();
            updateTypography();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(dir) {
            currentIndex += dir;
            render();
        }

        window.onload = render;
    </script>
</body>
</html>

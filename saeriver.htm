    <style>
        /* 기본 폰트 설정: UI는 나눔고딕, 본문은 나눔명조 지향 */

        }
        .church-prose blockquote p > strong:first-child + em {

</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-red-900 selection:text-white">

                    <i data-lucide="a-large-small" class="w-4 h-4 text-zinc-400 mr-1"></i>
                    <button onclick="changeTextSize(-1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">-</button>

    <script>
        lucide.createIcons();

        const episodes = [
            {
                title: "[1] 그날의 봄밤, 흔들리던 여교사의 마음 (feat. 고딩 최창환과의 인터뷰)",
                mainText: `
# [1] 그날의 봄밤, 흔들리던 여교사의 마음 (feat. 고딩 최창환과의 인터뷰)

**장윤영:** 언니, 대체 무슨 일이야? 이렇게 급하게 나를 부르고. 설마 그동안 꽁꽁 숨겨왔던 과거의 남자라도 고백하려는 건 아니지? 언니답지 않게 왜 이렇게 초조해 보여? (피식) <br><br>**손세미:** (물을 한 모금 마시며) 윤영아... 너는 나를 너무 잘 알면서도, 동시에 나를 전혀 모르는 것 같아. 내가 이렇게 너한테 연락한 건, 단순한 남자 문제가 아니야. 아니, 어쩌면 그 이상일 수도 있지. 내가... 그때, 2009년 그 봄에 겪었던 일을... 누구한테도 말 못 했어. 그런데 너라면... 너라면 이해해 줄 수 있을 것 같았어. 네가 워낙 '세상 물정'에 밝잖아. (씁쓸한 미소)<br><br>**장윤영:** (눈썹을 한껏 치켜뜨며) 오호라, '세상 물정'이라... 저 고고한 손세미 선생님 입에서 그런 말이 나오다니, 감격스럽네. 언니가 예전에 나더러 '세파에 찌들었다'느니 '교회의 덕을 흐린다'느니 하던 시절이 엊그제 같은데. 자, 그럼 그 '남자'... 아니, '세상 물정' 이야기를 한번 들어볼까? 어떤 망측한 일인지, 제가 감히 언니의 '선생님으로서의 위엄'을 깎아내리지 않는 선에서 아주 조심스럽게 파헤쳐 드릴게. 시작해 봐. 그 '봄' 얘기부터.<br><br>**손세미:** 후... 그래, 2009년 4월이었어. 대구 시내가 온통 벚꽃으로 흐드러지던 때였지. 오후 4시쯤이었나? 교인들 발길도 뜸해진 교회 고등부실에 앉아서... 나는 최창환을 기다리고 있었어. 그 아이가 인근 PC방에서 친구들이랑 어울리고 있다는 얘기를 듣고, 내가 잠시 들러달라고 불렀지. <br><br>**장윤영:** 최창환? 언니 반장 아이? 걔가 문제였구나. 설마 그때부터 언니의 '정숙한 교사' 가면이 흔들린 건가? (비웃는 듯한 표정)<br><br>**손세미:** (정색하며) 윤영아, 말 조심해. 나는 그저... 내 제자가 걱정되었을 뿐이야. 그 아이를 생각하면 한숨부터 터져 나왔어. 최근 그의 주변을 맴도는 소문들이... 내 마음을 너무 무겁게 만들고 있었으니까. <br><br>**장윤영:** 소문? 어떤 소문이었는데? 설마... 그 아이가 '선생님을 짝사랑한다'는 뭐 그런 순진한 소문은 아니었을 거고. <br><br>**손세미:** (얼굴이 살짝 붉어지며) 그게... 그냥 또래 이성과의 교제 수준이 아니었어. 몇몇 여학생들이랑... 아슬아슬한 선을 넘나들며 '뜨거운 밤'을 보낸다는 거였어. 심지어 상대방을 가리지 않는다는 이야기까지 들려왔지. <br><br>**장윤영:** (휘파람을 불며) 이야~ 고3짜리가 벌써부터 선수였네. 그래서 언니 마음이 무거웠다는 거야? '내가 가르치는 학생이 빗나가는구나!' 하고? 아니면... (의미심장하게 언니를 바라보며) 다른 종류의 '무거움'이었어? <br><br>**손세미:** (작게 한숨을 쉬며) 윤영아... 어떻게 그렇게 단정적으로 말할 수 있니? 나는 교사로서 그 아이가 혹시 나쁜 길로 빠질까 봐 걱정스러웠을 뿐이야. 그런데 더 충격적이었던 건, 그렇게 최창환이랑 밤을 보낸 여학생들이 결국은 그에게 매달리게 된다는 소문이었어. <br><br>**장윤영:** 매달려? 왜 매달려? 뭐가 그렇게 대단했길래? (흥미진진한 표정)<br><br>**손세미:** 그게... '크고, 강하고, 단단하고...' 그런 속삭임들이 내 귓가에 맴돌 때마다... 나는 저도 모르게 얼굴이 화끈 달아오르는 것을 느꼈어. 정숙한 여교사의 귀에는 너무나도 노골적이고 부끄러운 단어들이었지만... 동시에 알 수 없는 이끌림으로 내 상상력을 자극하는 것도 부인할 수 없었지. <br>*(타이핑을 치는 지금도 그때 그 소문을 떠올리면 목덜미가 살짝 뜨거워진다. 정말이지 창피한 일이다.)*<br><br>**장윤영:** (의기양양하게 웃으며) 흐음... 부끄럽다고 하면서도 '알 수 없는 이끌림'이라... 언니, 그때 이미 언니 속에서는 뭔가 꿈틀대고 있었네? 교사의 책임감 뒤로 숨겨진 언니의... 음... '여성 본능'이랄까? <br><br>**손세미:** (애써 담담한 척하며) 무슨 소리야. 그건 그저 그런 소문들에 대한 '혐오감'이자, 내 제자가 그런 일의 주인공이 되었다는 것에 대한 '경악'이었어. 그런데 지난주에는... 벚꽃놀이를 간다는 핑계로 새로운 친구를 데려왔더군. 165cm의 늘씬한 키에 새하얗고 맑은 피부, 누가 봐도 영악할 정도로 아름다운 여우상의 미녀였어. <br><br>**장윤영:** 와, 디테일 봐. 언니가 그렇게 외모 묘사에 신경 쓰는 거 처음 보네. 그 여학생이 그렇게 예뻤어? <br><br>**손세미:** 응... 고등부 교사들과 학생들 모두가 최창환이 데려온 그 친구에 대한 이야기를 수군거렸지만, 그 여학생이 최창환을 바라보던 눈빛의 의미를 정확히 알아챈 건 나밖에 없었을 거야. <br><br>**장윤영:** 그래서? 무슨 눈빛이었는데? '와, 존잘!' 이런 눈빛? <br><br>**손세미:** 아니... 황홀경에 빠진 듯, 온통 사랑에 물든 그 눈빛은 분명... 어젯밤 그들이 함께 보낸 시간의 흔적을 고스란히 담고 있었어. '크고, 강하고, 단단한' 그 무엇에 매료된 것이 너무나도 자명해 보였지. <br>*(그 눈빛을 아직도 잊을 수가 없다. 정말... 질투가 아니라... 그 아이에 대한 걱정 때문에 자세히 본 거다. 암... 그렇고 말고.)*<br><br>**장윤영:** 언니, 언니는 그걸 어떻게 그렇게 확신해? 혹시... 그 눈빛에서 언니가 상상했던 '뜨거운 밤'의 잔상을 본 건 아니야? (능글맞게)<br><br>**손세미:** (버럭) 윤영아! 네가 너무 나를 이상한 쪽으로 몰고 가잖아! 나는 그냥... 내 제자의 방황이 너무나도 안타까웠던 것뿐이야. 사실 최창환이 이렇게 방황의 길로 접어든 건 2008년 이맘때부터였어. <br><br>**장윤영:** 오, 그래? 무슨 계기가 있었어? <br><br>**손세미:** 2002년 소년부 겨울성경학교에서 보조교사로 처음 만났을 때부터 나를 사랑해왔다고, 그는 내게 고백했었지. 나는 단호하게 선을 그었어.

        let currentIndex = 0;
        let sizeLevel = 1; 
        let leadingLevel = 1; 
        
        const sizeClasses = ['prose-sm', 'prose-base', 'prose-lg', 'prose-xl'];
        const leadingClasses = ['prose-p:leading-tight', 'prose-p:leading-relaxed', 'prose-p:leading-loose'];
        const sizeLabels = ['S', 'M', 'L', 'XL'];
        const leadingLabels = ['좁게', '기본', '넓게'];

        const renderer = new marked.Renderer();
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true
        });

        function updateTypography() {
            const containers = [
                document.getElementById('main-text'),
                document.getElementById('cafe-comments'),
                document.getElementById('church-comments')
            ];
            
            containers.forEach(el => {
                if(!el) return;
                sizeClasses.forEach(c => el.classList.remove(c));
                leadingClasses.forEach(c => el.classList.remove(c));
                el.classList.add(sizeClasses[sizeLevel]);
                el.classList.add(leadingClasses[leadingLevel]);
            });

            document.getElementById('size-label').textContent = sizeLabels[sizeLevel];
            document.getElementById('leading-label').textContent = leadingLabels[leadingLevel];
        }

        function changeTextSize(step) {
            sizeLevel = Math.max(0, Math.min(sizeClasses.length - 1, sizeLevel + step));
            updateTypography();
        }

        function changeLineHeight(step) {
            leadingLevel = Math.max(0, Math.min(leadingClasses.length - 1, leadingLevel + step));
            updateTypography();
        }

        function renderEpisode(index) {
            const ep = episodes[index];
            if (!ep) return;

            const titleEl = document.getElementById('post-title');
            const mainTextEl = document.getElementById('main-text');
            const cafeCommentsEl = document.getElementById('cafe-comments');
            const churchCommentsEl = document.getElementById('church-comments');
            const indicatorEl = document.getElementById('page-indicator');

            const elements = [mainTextEl, cafeCommentsEl, churchCommentsEl];
            elements.forEach(el => {
                el.classList.remove('fade-in');
                void el.offsetWidth; 
                el.classList.add('fade-in');
            });

            titleEl.textContent = ep.title;
            mainTextEl.innerHTML = marked.parse(ep.mainText);
            cafeCommentsEl.innerHTML = marked.parse(ep.cafeComments);
            churchCommentsEl.innerHTML = marked.parse(ep.churchComments);

            indicatorEl.textContent = `DATA LOG #${index + 1} / ${episodes.length}`;

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === episodes.length - 1;
            
            updateTypography();
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < episodes.length) {
                currentIndex = newIndex;
                renderEpisode(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.onload = () => {
            renderEpisode(currentIndex);
        };

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명의 메조히스트 모임 - 관찰자 아카이브</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --base-font-size: 1.125rem;
        }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0f14 0%, #050505 80%);
            background-attachment: fixed;
            color: #ffffff;
        }
        
        .readable-text {
            font-family: 'Nanum Myeongjo', serif !important;
            word-break: keep-all;
            overflow-wrap: break-word;
            transition: font-size 0.2s ease, line-height 0.2s ease;
        }

        .control-panel {
            background: rgba(30, 30, 35, 0.95);
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .text-size-0 { font-size: 1.0rem !important; }
        .text-size-1 { font-size: 1.15rem !important; }
        .text-size-2 { font-size: 1.3rem !important; }
        .text-size-3 { font-size: 1.5rem !important; }
        .text-size-4 { font-size: 1.75rem !important; }

        .leading-step-0 { line-height: 1.6 !important; }
        .leading-step-1 { line-height: 2.0 !important; }
        .leading-step-2 { line-height: 2.5 !important; }

        .prose h3 {
            font-family: 'Nanum Gothic', sans-serif;
            color: #ffffff !important;
            font-weight: 800;
            border-left: 6px solid #b91c1c;
            padding-left: 1.25rem;
            margin-top: 3rem !important;
            margin-bottom: 1.5rem !important;
        }
        .prose strong {
            color: #ff5555 !important;
            font-weight: 800;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: rgba(185, 28, 28, 0.5);
        }
        .prose hr {
            border-color: #555 !important;
            margin: 4rem 0 !important;
        }

        .comment-divider {
            border-top: 1px solid #333;
            margin: 2rem 0;
            width: 100%;
        }

        .church-prose blockquote {
            border: none !important;
            margin: 1.5rem 0 !important;
            padding: 0 !important;
        }
        
        .comment-thread {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid #444;
            margin-bottom: 1rem;
        }

        .comment-reply {
            position: relative;
            margin-left: 2.5rem;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.25rem;
            border-radius: 12px;
            border-left: 4px solid #b91c1c;
        }

        .comment-reply::before {
            content: "";
            position: absolute;
            left: -1.5rem;
            top: 2rem;
            width: 1.2rem;
            height: 2px;
            background: #b91c1c;
        }

        .author-tag {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 0.9em;
            color: #e5e7eb;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comment-content {
            margin-top: 0.25rem;
            color: #d1d5db;
            line-height: 1.7;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-black/95 border-b border-zinc-800 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i data-lucide="shield-alert" class="text-red-600 w-5 h-5"></i>
                <h1 class="text-sm tracking-widest text-zinc-300 font-bold uppercase font-['Nanum_Gothic']">Log Viewer : Archive SS</h1>
            </div>
            
            <div class="hidden md:flex items-center space-x-6 control-panel px-6 py-2 rounded-full border border-zinc-700">
                <div class="flex items-center space-x-3 border-r border-zinc-700 pr-5">
                    <span class="text-[11px] text-zinc-500 font-bold uppercase">글자 크기</span>
                    <button onclick="updateSize(-1)" class="p-1 hover:bg-zinc-700 rounded-md transition-colors"><i data-lucide="minus-circle" class="w-5 h-5 text-zinc-400"></i></button>
                    <span id="size-indicator" class="text-sm font-bold w-12 text-center text-red-500">L</span>
                    <button onclick="updateSize(1)" class="p-1 hover:bg-zinc-700 rounded-md transition-colors"><i data-lucide="plus-circle" class="w-5 h-5 text-zinc-400"></i></button>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-[11px] text-zinc-500 font-bold uppercase">줄간격</span>
                    <button onclick="updateLeading(-1)" class="p-1 hover:bg-zinc-700 rounded-md transition-colors"><i data-lucide="chevrons-up-down" class="w-5 h-5 text-zinc-400"></i></button>
                    <span id="leading-indicator" class="text-sm font-bold w-14 text-center text-red-500">기본</span>
                    <button onclick="updateLeading(1)" class="p-1 hover:bg-zinc-700 rounded-md transition-colors"><i data-lucide="expand" class="w-5 h-5 text-zinc-400"></i></button>
                </div>
            </div>
        </div>
    </header>

    <div class="md:hidden fixed bottom-8 right-6 z-50 flex flex-col items-end space-y-3">
        <div id="mobile-menu" class="hidden flex flex-col space-y-4 bg-zinc-900/98 p-5 rounded-3xl border border-zinc-700 shadow-2xl backdrop-blur-xl">
            <div class="flex flex-col space-y-2">
                <p class="text-[10px] text-zinc-500 font-bold uppercase ml-1">Font Size</p>
                <div class="flex items-center justify-between space-x-4 bg-black/40 p-2 rounded-xl">
                    <button onclick="updateSize(-1)" class="w-10 h-10 bg-zinc-800 rounded-lg flex items-center justify-center"><i data-lucide="minus"></i></button>
                    <span id="size-indicator-mobile" class="text-sm font-bold text-red-500">L</span>
                    <button onclick="updateSize(1)" class="w-10 h-10 bg-zinc-800 rounded-lg flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>
            </div>
            <div class="flex flex-col space-y-2">
                <p class="text-[10px] text-zinc-500 font-bold uppercase ml-1">Spacing</p>
                <div class="flex items-center justify-between space-x-4 bg-black/40 p-2 rounded-xl">
                    <button onclick="updateLeading(-1)" class="w-10 h-10 bg-zinc-800 rounded-lg flex items-center justify-center"><i data-lucide="chevrons-up-down"></i></button>
                    <span id="leading-indicator-mobile" class="text-sm font-bold text-red-500">기본</span>
                    <button onclick="updateLeading(1)" class="w-10 h-10 bg-zinc-800 rounded-lg flex items-center justify-center"><i data-lucide="expand"></i></button>
                </div>
            </div>
        </div>
        <button onclick="toggleMobileControls()" class="w-16 h-16 bg-red-700 text-white rounded-full shadow-2xl flex items-center justify-center border-4 border-red-900/50">
            <i data-lucide="settings-2"></i>
        </button>
    </div>

    <main class="flex-grow w-full max-w-4xl mx-auto p-5 md:p-12 flex flex-col space-y-16">
        
        <div class="text-center space-y-6">
            <h2 id="post-title" class="text-4xl md:text-6xl font-extrabold text-white font-['Nanum_Gothic'] tracking-tighter leading-tight"></h2>
            <div class="h-1.5 w-32 bg-red-700 mx-auto rounded-full shadow-[0_0_15px_rgba(185,28,28,0.5)]"></div>
        </div>

        <article class="relative bg-zinc-900/30 p-8 md:p-12 rounded-3xl border border-zinc-800">
            <div id="main-text" class="readable-text prose prose-invert max-w-none text-white fade-in">
            </div>
        </article>

        <nav class="flex justify-between items-center py-10 border-y border-zinc-800/50 font-['Nanum_Gothic']">
            <button id="btn-prev" onclick="navigate(-1)" class="group flex items-center space-x-4 text-zinc-500 hover:text-white transition-all disabled:opacity-0">
                <i data-lucide="chevron-left" class="group-hover:-translate-x-2 transition-transform"></i>
                <span class="font-bold uppercase tracking-widest text-sm">Prev</span>
            </button>
            <span id="page-indicator" class="text-zinc-600 font-mono text-sm tracking-[0.5em] font-bold"></span>
            <button id="btn-next" onclick="navigate(1)" class="group flex items-center space-x-4 text-zinc-500 hover:text-white transition-all disabled:opacity-0">
                <span class="font-bold uppercase tracking-widest text-sm">Next</span>
                <i data-lucide="chevron-right" class="group-hover:translate-x-2 transition-transform"></i>
            </button>
        </nav>

        <div class="space-y-24 pb-48">
            <div class="space-y-8">
                <div class="flex items-center space-x-4 border-b-2 border-red-900/30 pb-4">
                    <div class="bg-red-900/20 p-2 rounded-lg">
                        <i data-lucide="shield-check" class="text-red-500 w-5 h-5"></i>
                    </div>
                    <h3 class="font-bold text-zinc-100 uppercase tracking-[0.2em] text-base font-['Nanum_Gothic']">Secret Cafe History</h3>
                </div>
                <div id="cafe-comments" class="readable-text prose prose-invert max-w-none text-zinc-100 fade-in">
                </div>
            </div>

            <div class="space-y-8">
                <div class="flex items-center space-x-4 border-b-2 border-zinc-800 pb-4">
                    <div class="bg-zinc-800/50 p-2 rounded-lg">
                        <i data-lucide="users" class="text-zinc-400 w-5 h-5"></i>
                    </div>
                    <h3 class="font-bold text-zinc-300 uppercase tracking-[0.2em] text-base font-['Nanum_Gothic']">Public : Church Board</h3>
                </div>
                <div id="church-comments" class="readable-text prose prose-invert max-w-none church-prose fade-in">
                </div>
            </div>
        </div>
    </main>

    <script>
        // HTML escape utility
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Parse church board Markdown format
        function parseChurchComments(mdText) {
            const lines = mdText.split('\n');
            const threads = [];
            let currentThread = null;
            let currentComment = null;
            let pendingContent = [];

            function flushComment() {
                if (currentComment && pendingContent.length > 0) {
                    currentComment.content = pendingContent.join('\n').trim();
                    if (currentComment.type === 'top') {
                        currentThread = { top: currentComment, replies: [] };
                        threads.push(currentThread);
                    } else if (currentComment.type === 'reply') {
                        if (currentThread) {
                            currentThread.replies.push(currentComment);
                        } else {
                            // orphan reply – wrap in its own thread
                            threads.push({ top: null, replies: [currentComment] });
                        }
                    }
                    currentComment = null;
                    pendingContent = [];
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                if (trimmed === '') continue;

                // Header line: > or >> followed by **nickname** *date*
                const headerMatch = trimmed.match(/^(>{1,2}) \*\*(.+?)\*\* \*(.+?)\*$/);
                if (headerMatch) {
                    flushComment();
                    const prefix = headerMatch[1];
                    const nickname = headerMatch[2];
                    const date = headerMatch[3];
                    const type = prefix === '>' ? 'top' : 'reply';
                    currentComment = { type, nickname, date, content: '' };
                    pendingContent = [];
                } else {
                    // Content line – must start with > or >>
                    let contentText = null;
                    if (line.startsWith('>> ')) {
                        contentText = line.substring(3).trim();
                    } else if (line.startsWith('> ')) {
                        contentText = line.substring(2).trim();
                    }
                    if (contentText !== null && currentComment) {
                        pendingContent.push(contentText);
                    }
                }
            }
            flushComment();

            // Build HTML
            let html = '';
            for (const thread of threads) {
                if (thread.top) {
                    html += `<div class="comment-thread">
                        <div class="author-tag">
                            <i data-lucide="user" class="w-4 h-4"></i> ${escapeHtml(thread.top.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(thread.top.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(thread.top.content).replace(/\n/g, '<br>')}</div>`;
                }
                for (const reply of thread.replies) {
                    html += `<div class="comment-reply">
                        <div class="author-tag">
                            <i data-lucide="user-plus" class="w-4 h-4 text-red-500"></i> ${escapeHtml(reply.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(reply.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                    </div>`;
                }
                if (thread.top) {
                    html += `</div>`;
                }
            }
            return html;
        }

        const episodes = [
            {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

                `
            },
                       {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

                `
            },
                        {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

                `
            },
                        {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

            },
                        {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

            },
                        {
                title: "은밀한 고해성사",
                mainText: `

                `,
                cafeComments: `

                `,
                churchComments: `

                `
            }
        ];

        let currentIndex = 0;
        let sizeLevel = 2; 
        let leadingLevel = 1; 

        const sizeLabels = ['S', 'M', 'L', 'XL', 'XXL'];
        const leadingLabels = ['좁게', '기본', '넓게'];

        function updateTypography() {
            const targets = document.querySelectorAll('.readable-text');
            targets.forEach(el => {
                for (let i = 0; i < 5; i++) el.classList.remove(`text-size-${i}`);
                for (let i = 0; i < 3; i++) el.classList.remove(`leading-step-${i}`);
                
                el.classList.add(`text-size-${sizeLevel}`);
                el.classList.add(`leading-step-${leadingLevel}`);
            });

            const sizeLabel = sizeLabels[sizeLevel];
            const leadingLabel = leadingLabels[leadingLevel];
            
            document.getElementById('size-indicator').textContent = sizeLabel;
            document.getElementById('leading-indicator').textContent = leadingLabel;
            
            if (document.getElementById('size-indicator-mobile')) {
                document.getElementById('size-indicator-mobile').textContent = sizeLabel;
                document.getElementById('leading-indicator-mobile').textContent = leadingLabel;
            }
        }

        function updateSize(step) {
            sizeLevel = Math.max(0, Math.min(4, sizeLevel + step));
            updateTypography();
        }

        function updateLeading(step) {
            leadingLevel = Math.max(0, Math.min(2, leadingLevel + step));
            updateTypography();
        }

        function toggleMobileControls() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function render() {
            const ep = episodes[currentIndex];
            document.getElementById('post-title').textContent = ep.title;
            
            document.getElementById('main-text').innerHTML = marked.parse(ep.mainText);
            
            const cafeHtml = marked.parse(ep.cafeComments).replace(/<hr>/g, '<div class="comment-divider"></div>');
            document.getElementById('cafe-comments').innerHTML = cafeHtml;
            
            // Parse church comments from Markdown format
            document.getElementById('church-comments').innerHTML = parseChurchComments(ep.churchComments);
            
            document.getElementById('page-indicator').textContent = `${currentIndex + 1} / ${episodes.length}`;
            
            document.getElementById('btn-prev').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next').style.visibility = currentIndex === episodes.length - 1 ? 'hidden' : 'visible';

            lucide.createIcons();
            updateTypography();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(dir) {
            currentIndex += dir;
            render();
        }

        window.onload = render;
    </script>
</body>
</html>

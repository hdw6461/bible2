    <script>
        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function buildCommentHtml(nickname, date, content, isReply = false) {
            return `
                <div class="comment-card ${isReply ? 'reply-card' : ''}">
                    <div class="comment-header">
                        <span class="comment-author">${isReply ? '<i data-lucide="corner-down-right" class="w-3 h-3 text-red-600"></i>' : ''}${escapeHtml(nickname)}</span>
                        <span class="comment-date">${escapeHtml(date)}</span>
                    </div>
                    <div class="comment-body">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                </div>
            `;
        }

        function parseMarkdownComments(mdText) {
            if (!mdText) return '';
            const lines = mdText.split('\n');
            let html = '';
            let current = null;
            let buffer = [];
            const flush = () => {
                if (current) {
                    html += buildCommentHtml(current.name, current.date, buffer.join('\n'), current.isReply);
                    buffer = []; current = null;
                }
            };
            for (let line of lines) {
                const headerMatch = line.trim().match(/^(>{0,2})\s*\*\*(.+?)\*\*\s*\((.+?)\)$/);
                const mdBoldMatch = line.trim().match(/^\*\*(.+?)\*\*\s*\((.+?)\)$/); 
                if (headerMatch || mdBoldMatch) {
                    flush();
                    const isReply = (headerMatch && headerMatch[1].length > 1);
                    const name = headerMatch ? headerMatch[2] : mdBoldMatch[1];
                    const date = headerMatch ? headerMatch[3] : mdBoldMatch[2];
                    current = { name, date, isReply };
                } else {
                    let content = line.trim();
                    if (content.startsWith('>> ')) content = content.substring(3);
                    else if (content.startsWith('> ')) content = content.substring(2);
                    if (content) buffer.push(content);
                }
            }
            flush();
            return html;
        }

        function formatMainContent(rawText) {
            const lines = rawText.split(/\r?\n/);
            let result = [];
            let inAfterStory = false;
            
            for (let line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;

                if (trimmed === '[인터뷰 후일담]') {
                    if (inAfterStory) result.push('</div></div>');
                    inAfterStory = true;
                    result.push(`<div class="after-story"><div class="after-story-title"><i data-lucide="feather" class="w-5 h-5"></i> 인터뷰 후일담</div><div class="after-story-content">`);
                    continue;
                }
                
                const match = trimmed.match(/^(장윤영|손세미):\s*(.*)$/);
                if (match) {
                    result.push(`
                        <div class="interview-speech">
                            <div class="speaker-block">
                                <span class="speaker-name" data-speaker="${match[1]}">${match[1]}</span>
                                <span class="speech-content">${escapeHtml(match[2])}</span>
                            </div>
                        </div>
                    `);
                } else {
                    if (inAfterStory) {
                        result.push(`<p>${escapeHtml(trimmed)}</p>`);
                    } else {
                        result.push(`<p class="mb-6">${escapeHtml(trimmed)}</p>`);
                    }
                }
            }
            if (inAfterStory) result.push('</div></div>');
            return result.join('');
        }

        let currentIndex = 0;
        let sizeLevel = 2; 
        let leadingLevel = 1;

        function updateTypography() {
            const targets = document.querySelectorAll('.dynamic-text');
            targets.forEach(el => {
                for (let i = 0; i < 5; i++) el.classList.remove(`text-size-${i}`);
                for (let i = 0; i < 3; i++) el.classList.remove(`leading-step-${i}`);
                el.classList.add(`text-size-${sizeLevel}`);
                el.classList.add(`leading-step-${leadingLevel}`);
            });
            document.getElementById('size-indicator').textContent = ['XS', 'S', 'M', 'L', 'XL'][sizeLevel];
            document.getElementById('leading-indicator').textContent = ['Tight', 'Normal', 'Loose'][leadingLevel];
        }

        function updateSize(step) { sizeLevel = Math.max(0, Math.min(4, sizeLevel + step)); updateTypography(); }
        function updateLeading(step) { leadingLevel = Math.max(0, Math.min(2, leadingLevel + step)); updateTypography(); }

        function render() {
            const ep = episodes[currentIndex];
            document.getElementById('post-title').textContent = ep.title;
            document.getElementById('main-text').innerHTML = formatMainContent(ep.mainText);
            document.getElementById('cafe-comments').innerHTML = parseMarkdownComments(ep.cafeComments);
            document.getElementById('church-comments').innerHTML = parseMarkdownComments(ep.churchComments);
            document.getElementById('page-num').textContent = `${currentIndex + 1} / ${episodes.length}`;
            lucide.createIcons();
            updateTypography();
        }

        function navigate(dir) {
            currentIndex = Math.max(0, Math.min(episodes.length - 1, currentIndex + dir));
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = render;
    </script>

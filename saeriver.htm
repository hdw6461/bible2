<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명의 메조히스트 모임 - 관찰자 아카이브</title>
    <!-- Tailwind CSS with Typography Plugin for Markdown -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 커스텀 다크 테마 및 스크롤바 */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0f14 0%, #050505 70%);
            background-attachment: fixed;
            color: #d1d5db;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* 텍스트 페이드 인 효과 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 글리치 효과 (제목용) */
        .glitch-hover:hover {
            text-shadow: 2px 0 red, -2px 0 blue;
            transition: all 0.2s;
        }

        /* 마크다운 내부 스타일 정밀 튜닝 */
        .prose h3 {
            color: #f3f4f6 !important;
            border-bottom: 1px solid #7f1d1d;
            padding-bottom: 0.5rem;
            margin-top: 2rem !important;
            letter-spacing: -0.025em;
        }
        .prose strong {
            color: #ffffff !important;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .prose em {
            color: #a1a1aa !important;
            font-style: italic;
        }
        .prose hr {
            border-color: #27272a !important;
            margin: 2.5rem 0 !important;
        }
        
        /* 카페 댓글 커스텀 스타일 (--- 구분선 및 닉네임/날짜) */
        #cafe-comments hr {
            border-top: 1px solid #3f3f46;
            margin: 1.5rem 0;
            border-bottom: none;
        }
        #cafe-comments p > strong:first-child {
            color: #ef4444; 
            font-size: 1.05em;
            margin-right: 0.5rem;
            display: inline-block;
        }
        #cafe-comments p > strong:first-child + em {
            color: #71717a;
            font-size: 0.85em;
            font-style: normal;
        }

        /* 대구서광교회 댓글 커스텀 스타일 (> 댓글, >> 대댓글) */
        .church-prose blockquote {
            border-left: 3px solid #3f3f46;
            background-color: rgba(63, 63, 70, 0.2);
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 0 0.5rem 0.5rem 0;
            color: #d1d5db;
            font-style: normal;
        }
        .church-prose blockquote blockquote {
            border-left: 3px solid #71717a;
            background-color: rgba(113, 113, 122, 0.2);
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }
        .church-prose blockquote p > strong:first-child {
            color: #e5e7eb;
            margin-right: 0.5rem;
        }
        .church-prose blockquote p > strong:first-child + em {
            color: #a1a1aa;
            font-size: 0.85em;
            font-style: normal;
        }
    </style>
</head>
<body class="font-serif antialiased min-h-screen flex flex-col selection:bg-red-900 selection:text-white">

    <!-- Header / Top Bar -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-zinc-800 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i data-lucide="eye" class="text-red-700 w-5 h-5 animate-pulse"></i>
                <h1 class="text-xs tracking-[0.3em] text-zinc-500 uppercase">Classified Target: <span class="text-zinc-300 font-bold glitch-hover transition-all cursor-default">S.S (1983)</span></h1>
            </div>
            <div class="flex items-center space-x-2 text-xs text-zinc-500 font-mono border border-zinc-800 px-2 py-1 rounded bg-zinc-900/50">
                <i data-lucide="lock" class="w-3 h-3"></i>
                <span>익명의 메조히스트 모임</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-5xl mx-auto p-4 md:p-6 lg:p-8 flex flex-col space-y-8" id="content-container">
        
        <!-- Post Header -->
        <div class="border-b border-zinc-800 pb-4 mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h2 id="post-title" class="text-2xl md:text-3xl font-bold text-zinc-100 tracking-tight mb-2"></h2>
                <p class="text-sm text-zinc-400 italic">Author: <span class="text-red-800 font-bold tracking-widest uppercase">WhiteLily83</span></p>
            </div>
            
            <!-- 가독성 조절 컨트롤러 -->
            <div class="flex items-center space-x-3 bg-zinc-900/80 border border-zinc-700 rounded-lg p-2 shadow-lg backdrop-blur self-start md:self-auto shrink-0">
                <div class="flex items-center space-x-1 border-r border-zinc-700 pr-3">
                    <i data-lucide="a-large-small" class="w-4 h-4 text-zinc-400 mr-1"></i>
                    <button onclick="changeTextSize(-1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">-</button>
                    <span id="size-label" class="text-xs font-mono text-zinc-300 w-4 text-center">M</span>
                    <button onclick="changeTextSize(1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">+</button>
                </div>
                <div class="flex items-center space-x-1 pl-1">
                    <i data-lucide="align-justify" class="w-4 h-4 text-zinc-400 mr-1"></i>
                    <button onclick="changeLineHeight(-1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">-</button>
                    <span id="leading-label" class="text-xs font-mono text-zinc-300 w-6 text-center">기본</span>
                    <button onclick="changeLineHeight(1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">+</button>
                </div>
            </div>
        </div>

        <!-- [몸글] Section -->
        <section class="bg-zinc-900/20 border border-zinc-800 rounded-lg p-6 md:p-10 shadow-2xl relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-1 h-full bg-red-900/30 group-hover:bg-red-700 transition-colors"></div>
            <div class="flex items-center space-x-2 mb-8 border-b border-zinc-800/50 pb-3">
                <i data-lucide="file-text" class="text-zinc-500 w-5 h-5"></i>
                <h3 class="text-lg font-bold text-zinc-400 tracking-[0.4em] uppercase">[ 몸글 ]</h3>
            </div>
            <!-- 마크다운 렌더링 영역 -->
            <div id="main-text" class="prose prose-invert prose-zinc prose-base prose-p:leading-relaxed max-w-none text-justify fade-in transition-all duration-300">
                <!-- Content Injected by JS -->
            </div>
        </section>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center py-4 border-y border-zinc-800/50">
            <button id="btn-prev" onclick="navigate(-1)" class="flex items-center space-x-2 text-zinc-500 hover:text-white transition-colors disabled:opacity-10 disabled:cursor-not-allowed px-4 py-2 bg-zinc-900/30 rounded border border-zinc-800">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                <span class="text-sm font-mono uppercase tracking-widest">PREV</span>
            </button>
            <span id="page-indicator" class="text-zinc-600 font-mono text-xs tracking-[0.3em]"></span>
            <button id="btn-next" onclick="navigate(1)" class="flex items-center space-x-2 text-zinc-500 hover:text-white transition-colors disabled:opacity-10 disabled:cursor-not-allowed px-4 py-2 bg-zinc-900/30 rounded border border-zinc-800">
                <span class="text-sm font-mono uppercase tracking-widest">NEXT</span>
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Comments Grid Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-24">
            
            <!-- [카페 댓글] Section -->
            <section class="bg-black/40 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6 pb-2 border-b border-zinc-800">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="message-square" class="text-red-900 w-4 h-4"></i>
                        <h3 class="text-sm font-bold text-zinc-400 tracking-widest uppercase">Secret Comments</h3>
                    </div>
                </div>
                <div id="cafe-comments" class="prose prose-invert prose-base prose-p:leading-relaxed max-w-none fade-in transition-all duration-300">
                    <!-- Content Injected by JS -->
                </div>
            </section>

            <!-- [대구서광교회 댓글] Section -->
            <section class="bg-zinc-900/10 border border-zinc-800 rounded-xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center opacity-[0.02] pointer-events-none">
                    <svg viewBox="0 0 100 100" class="w-48 h-48"><path d="M45,0 L55,0 L55,30 L85,30 L85,40 L55,40 L55,100 L45,100 L45,40 L15,40 L15,30 L45,30 Z" fill="white"/></svg>
                </div>
                
                <div class="flex items-center justify-between mb-6 pb-2 border-b border-zinc-800 relative z-10">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="cross" class="text-zinc-600 w-4 h-4"></i>
                        <h3 class="text-sm font-bold text-zinc-400 tracking-widest uppercase">Church Board</h3>
                    </div>
                </div>
                <div id="church-comments" class="prose prose-invert prose-base prose-p:leading-relaxed max-w-none church-prose fade-in relative z-10 transition-all duration-300">
                    <!-- Content Injected by JS -->
                </div>
            </section>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const episodes = [
            {
                title: "",
                mainText: `
                
                `,
                cafeComments: `
                
                `,
                churchComments: `
                
                `
            },
            {
                title: "",
                mainText: `
                
                `,
                cafeComments: `
                
                `,
                churchComments: `
                
                `
            },
                        {
                title: "",
                mainText: `

                cafeComments: `

                churchComments: `
                
                `
            },
                        {
                title: "",
                mainText: `

                cafeComments: `
                
                `,
                churchComments: `
                
                `
            },
                        {
                title: "",
                mainText: `
                
                `,
                cafeComments: `
                
                `,
                churchComments: `
                
                `
            },
                        {
                title: "",
                mainText: `
                
                `,
                cafeComments: `
                
                `,
                churchComments: `
                
                `
            }
            
        ];

        let currentIndex = 0;
        let sizeLevel = 1; 
        let leadingLevel = 1; 
        
        const sizeClasses = ['prose-sm', 'prose-base', 'prose-lg', 'prose-xl'];
        const leadingClasses = ['prose-p:leading-tight', 'prose-p:leading-relaxed', 'prose-p:leading-loose'];
        const sizeLabels = ['S', 'M', 'L', 'XL'];
        const leadingLabels = ['좁게', '기본', '넓게'];

        const renderer = new marked.Renderer();
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true
        });

        function updateTypography() {
            const containers = [
                document.getElementById('main-text'),
                document.getElementById('cafe-comments'),
                document.getElementById('church-comments')
            ];
            
            containers.forEach(el => {
                if(!el) return;
                sizeClasses.forEach(c => el.classList.remove(c));
                leadingClasses.forEach(c => el.classList.remove(c));
                el.classList.add(sizeClasses[sizeLevel]);
                el.classList.add(leadingClasses[leadingLevel]);
            });

            document.getElementById('size-label').textContent = sizeLabels[sizeLevel];
            document.getElementById('leading-label').textContent = leadingLabels[leadingLevel];
        }

        function changeTextSize(step) {
            sizeLevel = Math.max(0, Math.min(sizeClasses.length - 1, sizeLevel + step));
            updateTypography();
        }

        function changeLineHeight(step) {
            leadingLevel = Math.max(0, Math.min(leadingClasses.length - 1, leadingLevel + step));
            updateTypography();
        }

        function renderEpisode(index) {
            const ep = episodes[index];
            if (!ep) return;

            const titleEl = document.getElementById('post-title');
            const mainTextEl = document.getElementById('main-text');
            const cafeCommentsEl = document.getElementById('cafe-comments');
            const churchCommentsEl = document.getElementById('church-comments');
            const indicatorEl = document.getElementById('page-indicator');

            const elements = [mainTextEl, cafeCommentsEl, churchCommentsEl];
            elements.forEach(el => {
                el.classList.remove('fade-in');
                void el.offsetWidth; 
                el.classList.add('fade-in');
            });

            titleEl.textContent = ep.title;
            mainTextEl.innerHTML = marked.parse(ep.mainText);
            cafeCommentsEl.innerHTML = marked.parse(ep.cafeComments);
            churchCommentsEl.innerHTML = marked.parse(ep.churchComments);

            indicatorEl.textContent = `DATA LOG #${index + 1} / ${episodes.length}`;

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === episodes.length - 1;
            
            updateTypography();
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < episodes.length) {
                currentIndex = newIndex;
                renderEpisode(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.onload = () => {
            renderEpisode(currentIndex);
        };
    </script>
</body>
</html>

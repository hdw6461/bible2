    <style>
        /* 커스텀 다크 테마 및 스크롤바 */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0f14 0%, #050505 70%);
            background-attachment: fixed;
            color: #d1d5db;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* 텍스트 페이드 인 효과 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 글리치 효과 (제목용) */
        .glitch-hover:hover {
            text-shadow: 2px 0 red, -2px 0 blue;
            transition: all 0.2s;
        }

        /* 마크다운 내부 스타일 정밀 튜닝 */
        .prose h3 {
            color: #f3f4f6 !important;
            border-bottom: 1px solid #7f1d1d;
            padding-bottom: 0.5rem;
            margin-top: 2rem !important;
            letter-spacing: -0.025em;
        }
        .prose strong {
            color: #ffffff !important;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .prose em {
            color: #a1a1aa !important;
            font-style: italic;
        }
        .prose hr {
            border-color: #27272a !important;
            margin: 2.5rem 0 !important;
        }
        
        /* 카페 댓글 커스텀 스타일 (--- 구분선 및 닉네임/날짜) */
        #cafe-comments hr {
            border-top: 1px solid #3f3f46;
            margin: 1.5rem 0;
            border-bottom: none;
        }
        #cafe-comments p > strong:first-child {
            color: #ef4444; 
            font-size: 1.05em;
            margin-right: 0.5rem;
            display: inline-block;
        }
        #cafe-comments p > strong:first-child + em {
            color: #71717a;
            font-size: 0.85em;
            font-style: normal;
        }

        /* 대구서광교회 댓글 커스텀 스타일 (> 댓글, >> 대댓글) */
        .church-prose blockquote {
            border-left: 3px solid #3f3f46;
            background-color: rgba(63, 63, 70, 0.2);
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 0 0.5rem 0.5rem 0;
            color: #d1d5db;
            font-style: normal;
        }
        .church-prose blockquote blockquote {
            border-left: 3px solid #71717a;
            background-color: rgba(113, 113, 122, 0.2);
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }
        .church-prose blockquote p > strong:first-child {
            color: #e5e7eb;
            margin-right: 0.5rem;
        }
        .church-prose blockquote p > strong:first-child + em {
            color: #a1a1aa;
            font-size: 0.85em;
            font-style: normal;
        }
    </style>
</head>
<body class="font-serif antialiased min-h-screen flex flex-col selection:bg-red-900 selection:text-white">

            <!-- 가독성 조절 컨트롤러 -->

                    <i data-lucide="a-large-small" class="w-4 h-4 text-zinc-400 mr-1"></i>
                    <button onclick="changeTextSize(-1)" class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:bg-zinc-700 hover:text-white transition-colors">-</button>
                    <span id="size-label" class="text-xs font-mono text-zinc-300 w-4 text-center">M</span>

        <!-- Navigation Buttons -->

        <!-- Comments Grid Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-24">
            
            <!-- [카페 댓글] Section -->
            <section class="bg-black/40 border border-zinc-800 rounded-xl p-6 shadow-xl">

                        <i data-lucide="message-square" class="text-red-900 w-4 h-4"></i>

                <div id="cafe-comments" class="prose prose-invert prose-base prose-p:leading-relaxed max-w-none fade-in transition-all duration-300">

            <!-- [대구서광교회 댓글] Section -->

                    </div>
                </div>
                <div id="church-comments" class="prose prose-invert prose-base prose-p:leading-relaxed max-w-none church-prose fade-in relative z-10 transition-all duration-300">
                    <!-- Content Injected by JS -->
                </div>
            </section>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const episodes = [
            {
                title: "[1] 그 아이의 방황, 제자 사랑이었다고… (09년 봄날의 고백)",
                mainText: `
                # [1] 그 아이의 방황, 제자 사랑이었다고… (09년 봄날의 고백)

손세미입니다. 이 닉네임, 정말 오랜만이네요. 83여교사… 왠지 좀 민망하기도 하고, 으음. 그래도 어쩌겠어요, 제가 직접 타이핑 치는 게 제일 마음 편하니까요. <br><br>오늘 윤영이랑 만난 대화 내용을 쭉 옮겨 적어봤어요. 사실 이 대화를 시작하기 전에 한참을 고민했어요. 내가 이런 이야기를 해도 될까, 이게 과연 옳은 일일까 하고요. 하지만 윤영이 말대로, 어쩌면 이 감정들을 제대로 마주하는 것만이 저를 위한 길일지도 모르겠다는 생각이 들었어요. 물론, 지금도 제가 하는 말들이 다 맞다고 생각하는 건 아니지만요… ^^;<br><br>***<br><br>**녹취록: 2013년 4월 17일, 카페 ‘Secret Garden’에서 83여교사 손세미와 장윤영의 대화**<br><br>**장윤영:** 선배, 오랜만이에요. 연락도 없이 갑자기 이런 얘길 털어놓고 싶다니, 무슨 일이에요? 선배답지 않게 말이죠? ㅋㅋㅋ 제가 알기론 선배, 평소에 저 되게 싫어했잖아요. 좀 문란하고… 남자 문제 복잡하다고… (식 웃음)<br><br>**손세미:** (작게 한숨) 윤영아… 꼭 그렇게 콕 집어 말해야겠니? 아, 미안하다. 솔직히 그랬던 건 사실이야. 하지만 지금은… 지금은 네가 필요해. 그때 일을 누구한테 말해야 할지 정말 고민 많이 했는데, 결국 네가 제일 적합한 사람이라는 생각이 들더라. 내 감정들을 제일 잘 이해해줄 수 있을 것 같았어. 아, 물론… 오해하진 마. 이게 어떤 '감정'이라고 단정할 수 있는 건 아니야. 그저… 혼란스러운 과거라고 해야 할까.<br><br>**장윤영:** 허… 선배 입에서 그런 말이 나오다니. 놀랍네요, 정말. 좋아요, 그럼 선배가 말한 그 ‘혼란스러운 과거’, 어디 한번 들어볼까요? 2009년 4월, 대구 서광교회 고등부, 스물일곱 살 손세미 선생님과 고3 최창환… 맞죠? 그때 무슨 일이 있었던 건데요?<br><br>**손세미:** 응… 2009년 4월, 정말 벚꽃이 예쁘게 피던 봄날이었지. 나는 고등부실에서 창환이를 기다리고 있었어. 그 아이가 인근 PC방에서 친구들과 어울리고 있다는 얘길 듣고, 잠깐 교회에 들러달라고 연락했었거든. *(타이핑을 치는 지금도 그때의 벚꽃 향기가 코끝에 스치는 것 같다. 아, 그때는 정말 아름다운 계절이었는데…)*<br><br>**장윤영:** PC방이요? 공부해야 할 고3이? 뭐, 흔한 일이죠. 그런데 특별히 선배가 직접 불러들일 정도면… 뭔가 큰일이 있었나 봐요? 혹시 그때 그 소문들 때문에요? 최창환이 몇몇 여학생들이랑 ‘뜨거운 밤’을 보낸다는… 그 소문 말이에요.<br><br>**손세미:** (흠칫하며) 윤영아! 말 조심해! 아무리 우리끼리의 대화라고 해도, 그런 천박한 표현은… ㅠㅠ… 물론, 그 소문들이 내 귀에도 들려왔었지. 그저 또래와 교제하는 수준이 아니라, 몇몇 여학생들과 아슬아슬한 선을 넘나들며, 심지어는 상대방을 가리지 않는다는… 정말 충격적이었어. 게다가 그렇게 밤을 보낸 여학생들이 결국은 그 아이에게 매달리게 된다는 얘기도 들려왔고. 나는… 나는 고등부 담임교사로서, 그 아이가 올바른 길로 가지 못하고 방황하는 모습에 너무나도 가슴 아팠어. *(솔직히 그 소문들이 내 상상력을 자극했던 것도 부인할 수는 없지. 정숙한 교사에게는 너무 노골적인 말들이었지만… 내 안에 숨겨져 있던 무언가를 건드린 기분이었어. 부끄럽지만…)*<br><br>**장윤영:** 흐음… 그렇게 속으로는 뜨거운 상상력을 발휘하면서, 겉으로는 ‘선생님의 안타까움’으로 포장했다는 거죠? ㅋㅋㅋ 그런데 그 소문의 핵심이 뭐였죠? ‘크고, 강하고, 단단한’ 뭐 그런 거 아니었나요? 선배 귀에도 그런 게 맴돌았을 텐데, 솔직히 그때 어떤 기분이었어요?<br><br>**손세미:** (얼굴이 붉어지는 게 느껴진다) 아, 윤영아! 정말…! 그런 이야기는… 정말 입에 담기도 민망한 소문들이었어. 하지만… 솔직히 말해서, 그 소문들이 내 머릿속을 맴돌 때마다 나도 모르게 얼굴이 화끈 달아오르는 걸 느꼈어. 물론, 그건 부끄러움 때문이었지. 교사로서, 그런 음탕한 소문을 듣는 것 자체가… 얼마나 수치스러운 일이었겠니? 하지만 동시에… 음… 알 수 없는 이끌림도 있었던 것 같아. 호기심이라고 해야 할까? 그게 뭔지 궁금한… 뭐, 그런.<br><br>**장윤영:** 궁금한… 뭔지 궁금한… ㅋㅋㅋ 알겠습니다. 그럼 지난주에 벚꽃놀이 핑계로 데려왔다는 그 ‘새로운 친구’는 어땠어요? 165cm에 새하얀 피부, 영악한 여우상 미녀? 그 학생을 보고도 '순수한 제자 사랑'만 떠올랐을까요?<br><br>**손세미:** (불쾌감을 감추지 못하며) 윤영아, 왜 자꾸 내 마음을 의심하는 말을 하니? 나는… 그 아이를 보면서 창환이가 더 깊이 타락의 길로 빠질까 봐 걱정했을 뿐이야. 물론, 누가 봐도 아름다운 학생이었지. 하지만… 그 여학생이 창환이를 바라보던 눈빛은… 정말 황홀경에 빠진 듯, 온통 사랑에 물든 눈빛이었어. 분명 어젯밤 그들이 함께 보낸 시간의 흔적을 고스란히 담고 있었다는 생각이 들었지. ‘크고, 강하고, 단단한’ 그 무엇에 매료된 것이 너무나도 자명해 보여서… 그게 더 걱정스러웠다고.<br><br>**장윤영:** 아하. 그렇게 창환이가 ‘타락’하는 모습이 선배 눈에는 다 보였는데… 왜 그는 그렇게 됐을까요? 혹시 선배가 2008년에 그 애 고백을 단호하게 거절해서 그런 건 아닐까요? ‘선생님은 결혼 적령기고, 너는 고등학생이니 또래 만나렴.’ 이렇게 말이죠? 제 기억으로는 그때 선배가 꽤 도도하게 굴었었던 것 같은데… ㅎㅎㅎ<br><br>**손세미:** (말문이 막힌 듯 잠시 침묵) 하… 윤영아, 너무 아프게 찌르지 마… ㅠㅠ… 맞아. 사실 창환이가 그렇게 방황의 길로 접어든 건 2008년 이맘때부터였어. 그 아이는 2002년 소년부 겨울성경학교에서 보조교사로 처음 만났을 때부터 나를 사랑해왔다고, 내게 고백했었어. 나는… 나는 그저 올바른 선생님으로서, 그 아이가 현실을 직시하고 건강하게 자라기를 바랐을 뿐이야. 그래서 단호하게 선을 그었지. “창환아, 선생님은 이제 결혼적령기를 앞둔 여교사이고, 너는 아직 고등학생에 불과하단다. 또래의 예쁜 친구들을 만나렴.” 그렇게 조언했었어. 그런데… 내가 바랐던 ‘또래의 여성’이 이렇게 ‘뜨거운 밤’을 함께 보낼 줄은… 꿈에도 상상하지 못했지. 나는… 그저 그 아이가 더는 상처받지 않고, 바르게 성장하길 바랐을 뿐이야. *(그때 내 가슴은 단단한 돌멩이 같았지. 흔들리지 않으려고 얼마나 애썼는지… 하지만 그 ‘뜨거운 밤’ 소문을 들었을 땐… 솔직히 좀 충격적이었어. 내가 원하던 그림은 아니었거든.)*<br><br>**장윤영:** 네, 뭐, 그랬겠죠. 그렇게 교사로서의 의무감을 다하던 선배 앞에, 드디어 그 문제아 최창환 군이 문을 열고 들어섰군요. 선배는 어떻게 그를 ‘꾸짖었’나요?<br><br>**손세미:** 나는 애써 침착한 표정을 지으며, 단호하면서도 그의 마음에 상처를 주지 않도록 부드러운 어조로 말했어. “창환아… 선생님은 네가, 더 이상 네 몸을 그렇게 함부로 굴리지 않았으면 좋겠어.” 그렇게 말했지. 나는 정말 그 아이를 걱정하는 마음뿐이었어.<br><br>**장윤영:** 그런데 최창환의 반응은 어땠나요? 꾸중을 듣고 반성하는 척이라도 하던가요? 아니면… 다른 꿍꿍이가 있었던 건 아닐까요?<br><br>**손세미:** 그는 고개를 숙인 채 한동안 말이 없었어. 그런데… 이상하게도, 그의 시선이 내 얇은 블라우스 너머로 솟아오른 내 젖가슴을 향하고 있는 것만 같았어. 순간… 부끄러움과 함께 묘한 긴장감이 실내를 가득 채웠지. 내 몸이 화끈 달아오르는 기분이었어. 당황스러움에 어찌할 바를 모르던 찰나, 그 아이가 나직이 입을 열었어. “선생님 앞에 서면… 전 아직도 열두 살 꼬마 같아요. 제가 너무 보잘것없어 보여서… 그런데 다른 애들이랑 있을 때만큼은 제가 대단한 남자가 된 것 같아서…” 그렇게 말하더라. *(지금 생각해도 그때 그 아이의 눈빛은… 묘했어. 정말 내 가슴을 뚫어져라 쳐다보는 것 같아서 너무 민망했어. ㄷㄷㄷ 그런데 또 한편으로는… 어휴, 내가 왜 이런 생각까지 하는지…)*<br><br>**장윤영:** 맙소사. 고등학생이 선생님한테 게 살아있었던 건 아닐까. 지금은 서른한 살 솔로 여교사… 에휴. 그 시절은 그저 나의 치기 어린 방황, 아니, 나의 어설픈 '메조히스트적 본능'을 발견하는 순간이었던 것 같다. 씁쓸하네. OTL

        let currentIndex = 0;
        let sizeLevel = 1; 
        let leadingLevel = 1; 
        
        const sizeClasses = ['prose-sm', 'prose-base', 'prose-lg', 'prose-xl'];
        const leadingClasses = ['prose-p:leading-tight', 'prose-p:leading-relaxed', 'prose-p:leading-loose'];
        const sizeLabels = ['S', 'M', 'L', 'XL'];
        const leadingLabels = ['좁게', '기본', '넓게'];

        const renderer = new marked.Renderer();
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true
        });

        function updateTypography() {
            const containers = [
                document.getElementById('main-text'),
                document.getElementById('cafe-comments'),
                document.getElementById('church-comments')
            ];
            
            containers.forEach(el => {
                if(!el) return;
                sizeClasses.forEach(c => el.classList.remove(c));
                leadingClasses.forEach(c => el.classList.remove(c));
                el.classList.add(sizeClasses[sizeLevel]);
                el.classList.add(leadingClasses[leadingLevel]);
            });

            document.getElementById('size-label').textContent = sizeLabels[sizeLevel];
            document.getElementById('leading-label').textContent = leadingLabels[leadingLevel];
        }

        function changeTextSize(step) {
            sizeLevel = Math.max(0, Math.min(sizeClasses.length - 1, sizeLevel + step));
            updateTypography();
        }

        function changeLineHeight(step) {
            leadingLevel = Math.max(0, Math.min(leadingClasses.length - 1, leadingLevel + step));
            updateTypography();
        }

        function renderEpisode(index) {
            const ep = episodes[index];
            if (!ep) return;

            const titleEl = document.getElementById('post-title');
            const mainTextEl = document.getElementById('main-text');
            const cafeCommentsEl = document.getElementById('cafe-comments');
            const churchCommentsEl = document.getElementById('church-comments');
            const indicatorEl = document.getElementById('page-indicator');

            const elements = [mainTextEl, cafeCommentsEl, churchCommentsEl];
            elements.forEach(el => {
                el.classList.remove('fade-in');
                void el.offsetWidth; 
                el.classList.add('fade-in');
            });

            titleEl.textContent = ep.title;
            mainTextEl.innerHTML = marked.parse(ep.mainText);
            cafeCommentsEl.innerHTML = marked.parse(ep.cafeComments);
            churchCommentsEl.innerHTML = marked.parse(ep.churchComments);

            indicatorEl.textContent = `DATA LOG #${index + 1} / ${episodes.length}`;

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === episodes.length - 1;
            
            updateTypography();
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < episodes.length) {
                currentIndex = newIndex;
                renderEpisode(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.onload = () => {
            renderEpisode(currentIndex);
        };

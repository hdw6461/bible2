<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명의 메조히스트 모임 - 관찰자 아카이브</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --base-font-size: 1.125rem;
        }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a0f14 0%, #050505 80%);
            background-attachment: fixed;
            color: #ffffff;
            padding-bottom: 80px; /* 플로팅 네비를 위한 여백 */
        }
        
        .readable-text {
            font-family: 'Nanum Myeongjo', serif !important;
            word-break: keep-all;
            overflow-wrap: break-word;
            transition: font-size 0.2s ease, line-height 0.2s ease;
        }

        /* 인터뷰 대화 스타일 */
        .interview-speech {
            margin-bottom: 1.8rem;
            padding-left: 0.5rem;
            transition: margin 0.2s ease;
        }
        
        .speaker-block {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.5rem;
        }
        
        .speaker-name {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 1.1em;
            letter-spacing: -0.3px;
            background: rgba(185, 28, 28, 0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            color: #ffb3b3;
            text-shadow: 0 0 2px rgba(0,0,0,0.3);
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        
        .speaker-name[data-speaker="손세미"] {
            color: #ff8c8c;
            background: rgba(220, 38, 38, 0.25);
            border-left: 3px solid #ef4444;
        }
        
        .speech-content {
            flex: 1;
            line-height: 1.65;
            word-break: keep-all;
        }
        
        .normal-paragraph {
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px dashed #2c2c2c;
            border-bottom: 1px dashed #2c2c2c;
            color: #cbd5e1;
            font-style: normal;
        }
        
        @media (max-width: 640px) {
            .speaker-name {
                white-space: normal;
                font-size: 0.9rem;
                padding: 0.15rem 0.6rem;
            }
            .interview-speech {
                margin-bottom: 1.5rem;
            }
        }

        .control-panel {
            background: rgba(30, 30, 35, 0.95);
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .text-size-0 { font-size: 1.0rem !important; }
        .text-size-1 { font-size: 1.15rem !important; }
        .text-size-2 { font-size: 1.3rem !important; }
        .text-size-3 { font-size: 1.5rem !important; }
        .text-size-4 { font-size: 1.75rem !important; }

        .leading-step-0 { line-height: 1.6 !important; }
        .leading-step-1 { line-height: 2.0 !important; }
        .leading-step-2 { line-height: 2.5 !important; }

        .prose h3 {
            font-family: 'Nanum Gothic', sans-serif;
            color: #ffffff !important;
            font-weight: 800;
            border-left: 6px solid #b91c1c;
            padding-left: 1.25rem;
            margin-top: 3rem !important;
            margin-bottom: 1.5rem !important;
        }
        .prose strong {
            color: #ff5555 !important;
            font-weight: 800;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: rgba(185, 28, 28, 0.5);
        }
        .prose hr {
            border-color: #555 !important;
            margin: 4rem 0 !important;
        }

        .comment-divider {
            border-top: 1px solid #333;
            margin: 2rem 0;
            width: 100%;
        }

        .church-prose blockquote {
            border: none !important;
            margin: 1.5rem 0 !important;
            padding: 0 !important;
        }
        
        .comment-thread {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid #444;
            margin-bottom: 1rem;
        }

        .comment-reply {
            position: relative;
            margin-left: 2.5rem;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.25rem;
            border-radius: 12px;
            border-left: 4px solid #b91c1c;
        }

        .comment-reply::before {
            content: "";
            position: absolute;
            left: -1.5rem;
            top: 2rem;
            width: 1.2rem;
            height: 2px;
            background: #b91c1c;
        }

        .author-tag {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 0.9em;
            color: #e5e7eb;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comment-content {
            margin-top: 0.25rem;
            color: #d1d5db;
            line-height: 1.7;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 플로팅 네비게이션 ========== */
        .floating-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #3f3f46;
            border-radius: 60px;
            padding: 8px 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .floating-nav button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            border: none;
            color: #d4d4d8;
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: 40px;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .floating-nav button:hover:not(:disabled) {
            background: rgba(185, 28, 28, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .floating-nav button:active:not(:disabled) {
            transform: translateY(0);
        }

        .floating-nav .nav-divider {
            width: 1px;
            height: 20px;
            background: #3f3f46;
            margin: 0 2px;
        }

        .floating-nav .page-info {
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
            color: #71717a;
            padding: 0 4px;
            letter-spacing: 0.2em;
        }

        @media (max-width: 640px) {
            .floating-nav {
                bottom: 20px;
                gap: 6px;
                padding: 6px 12px;
                border-radius: 50px;
            }
            .floating-nav button {
                font-size: 0.75rem;
                padding: 8px 12px;
                gap: 4px;
            }
            .floating-nav .page-info {
                font-size: 0.7rem;
            }
            body {
                padding-bottom: 100px;
            }
        }
        /* ======================================== */

    <script>
        // HTML escape utility
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 인터뷰 텍스트를 가독성 높은 HTML 로 변환
        function beautifyInterviewText(rawText) {
            if (!rawText) return '';
            const lines = rawText.split(/\r?\n/);
            let resultHtml = [];
            let normalBuffer = [];
            
            const speakerPattern = /^(장윤영|손세미):\s*(.*)$/;
            
            const flushNormal = () => {
                if (normalBuffer.length) {
                    const paraText = normalBuffer.join(' ').trim();
                    if (paraText) {
                        resultHtml.push(`<div class="normal-paragraph">${escapeHtml(paraText)}</div>`);
                    }
                    normalBuffer = [];
                }
            };
            
            for (let line of lines) {
                const trimmed = line.trim();
                if (trimmed === '') continue;
                
                const match = trimmed.match(speakerPattern);
                if (match) {
                    flushNormal();
                    
                    const speaker = match[1];
                    let content = match[2].trim();
                    if (content) {
                        content = escapeHtml(content).replace(/\n/g, '<br>');
                    }
                    resultHtml.push(`
                        <div class="interview-speech">
                            <div class="speaker-block">
                                <span class="speaker-name" data-speaker="${speaker}">${escapeHtml(speaker)}</span>
                                <span class="speech-content">${content || ''}</span>
                            </div>
                        </div>
                    `);
                } else {
                    normalBuffer.push(trimmed);
                }
            }
            flushNormal();
            
            return resultHtml.join('');
        }
        
        // Parse church board Markdown format
        function parseChurchComments(mdText) {
            const lines = mdText.split('\n');
            const threads = [];
            let currentThread = null;
            let currentComment = null;
            let pendingContent = [];

            function flushComment() {
                if (currentComment && pendingContent.length > 0) {
                    currentComment.content = pendingContent.join('\n').trim();
                    if (currentComment.type === 'top') {
                        currentThread = { top: currentComment, replies: [] };
                        threads.push(currentThread);
                    } else if (currentComment.type === 'reply') {
                        if (currentThread) {
                            currentThread.replies.push(currentComment);
                        } else {
                            threads.push({ top: null, replies: [currentComment] });
                        }
                    }
                    currentComment = null;
                    pendingContent = [];
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                if (trimmed === '') continue;

                const headerMatch = trimmed.match(/^(>{1,2}) \*\*(.+?)\*\* \((.+?)\)$/);
                if (headerMatch) {
                    flushComment();
                    const prefix = headerMatch[1];
                    const nickname = headerMatch[2];
                    const date = headerMatch[3];
                    const type = prefix === '>' ? 'top' : 'reply';
                    currentComment = { type, nickname, date, content: '' };
                    pendingContent = [];
                } else {
                    let contentText = null;
                    if (line.startsWith('>> ')) {
                        contentText = line.substring(3).trim();
                    } else if (line.startsWith('> ')) {
                        contentText = line.substring(2).trim();
                    }
                    if (contentText !== null && currentComment) {
                        pendingContent.push(contentText);
                    }
                }
            }
            flushComment();

            let html = '';
            for (const thread of threads) {
                if (thread.top) {
                    html += `<div class="comment-thread">
                        <div class="author-tag">
                            <i data-lucide="user" class="w-4 h-4"></i> ${escapeHtml(thread.top.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(thread.top.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(thread.top.content).replace(/\n/g, '<br>')}</div>`;
                }
                for (const reply of thread.replies) {
                    html += `<div class="comment-reply">
                        <div class="author-tag">
                            <i data-lucide="user-plus" class="w-4 h-4 text-red-500"></i> ${escapeHtml(reply.nickname)} <span class="text-zinc-500 text-sm ml-2">${escapeHtml(reply.date)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                    </div>`;
                }
                if (thread.top) {
                    html += `</div>`;
                }
            }
            return html;
        }

        // 에피소드 데이터 (mainText 인터뷰 포함)
        const episodes = [
{
                title: "# [1] 그날 오피스텔에서의 일",
                mainText: `
# [1] 그날 오피스텔에서의 일

장윤영: 언니, 대체 무슨 용기로 그 어린애를 집까지 끌어들였어? 아무리 비가 왔다지만, 언니 성격에? 설마 그냥 '선생님의 사명감' 따위로 포장하는 건 아니지? ㅋㅋㅋㅋ
손세미: (얼굴이 화끈거린다) 윤영아, 말 조심해. 끌어들였다니! 그때 창환이는... 정말 너무 절박해 보였어. 수능이 딱 50일 남은 시점이었고, 그 아이 눈빛이... 그 부담감에 짓눌린 마지막 발악 같았다고.
장윤영: 발악? 언니, 내가 보기엔 언니를 향한 욕망의 불길이 이글거린 것 같은데? 맨날 언니가 해주는 그 '은밀한 봉사'에 잔뜩 취해 있었을 거 아니야. 안 그래? '오피스텔로 가자'는 그 대사에서 벌써 야릇한 기운이 팍팍 느껴진다고, 선세미 선생님.

# [4] 스물일곱 선생님의 첫 경험과 창환이의 '일곱 번째 여성'

장윤영: 언니, 지난번에 그 고3 제자 창환이 이야기, 한 달 만에 또 뭔가 큰일이 터졌다고 했죠? 그 꼬맹이가 언니 소개팅 소식 듣고 길길이 날뛰었다면서요? 그때 언니 나이가 스물일곱, 그 애는 고작 열아홉 살이었잖아요. 어린애 감정 가지고 뭐 그리 흔들렸다고 그래요, 솔직히? 설마 또 그 애한테 약점 잡힌 건 아니죠?
손세미: (얼굴을 붉히며) 윤영아… 말 좀 가려 해. 약점이라니… 그건… 그냥… 내가 죄책감에 시달렸을 뿐이야. 어머니 성화에 못 이겨 나간 그 소개팅이, 그렇게 큰 파장을 몰고 올 줄은 정말 몰랐어. 네 살 많은 오빠와의 만남이 채 일주일도 안 돼서 창환이 귀에 들어갔다는 소문이 돌더라고. 그때부터 창환이는 날… 아주 차갑게 대했어. 예배 후에 내 시선을 애써 외면하고 싸늘하게 돌아선 뒷모습을 보는데… 정말 세상 모든 비참함이 한꺼번에 밀려오는 것 같더라.
장윤영: 비참함이요? 언니, 그때 언니 심정은 '죄책감'이라기보다는 '어린 애한테 질투 유발하려다 역효과 난 데 대한 당혹감' 아니었어요? 스물일곱 살 다 큰 처녀가 고등학생한테 찬밥 신세 당했다고 우는 게 말이 돼요? 그리고 그 녀석이 언니 오피스텔 벨을 밤 11시에 눌렀을 때, 언니 심장은 '아, 올 것이 왔구나' 싶었을 걸요? 솔직히 말해봐요, 그 아이의 싸늘한 냉대가 언니의 숨겨진 마조히즘을 자극하진 않았어요? 괘씸한데… 한편으론 너무 짜릿하게 언니를 흔든 거죠?
손세미: (고개를 숙이며) 으음… 윤영아, 제발… 그렇게까지 말할 것까진 없잖아. 그저… 내가 너무 미안해서 그랬어. 2009년 그때, 스물일곱의 내가, 그 아이의 상처받은 마음을 어루만져 줘야 한다는 생각뿐이었어. 내가 울다 지쳐 잠들었는데, 벨이 울리는 순간… 정말 심장이 멎는 줄 알았어. 흐트러진 잠옷 차림에 헝클어진 머리, 눈물로 엉망이 된 얼굴 그대로 현관까지 달려 나가서… 그 아이를 붙잡았어. 어깨에 얼굴을 묻고, 떨리는 목소리로 속삭였지. “미안해, 창환아… 선생님이 정말 미안해.” 내 진심 어린 사과에, 굳게 닫혀 있던 창환이 표정이 얼음 녹듯 풀리는 걸 느꼈어.
장윤영: (비웃듯) 진심 어린 사과? 언니, 그 표정이 풀린 게 언니의 '진심' 때문이었을까요, 아니면 밤늦게 찾아온 '목표물'을 눈앞에 둔 수컷의 본능 때문이었을까요? 언니는 그때 분명히 봤을 거예요. 그 아이 눈빛 속에서 차가운 분노 대신 '희미한 갈증' 같은 게 피어오르는 걸. 그게 뭔지 알면서도, 아니, 오히려 그걸 은근히 기대하면서도 잡고 싶었잖아요. 열아홉 살 피 끓는 청년의 갈증을… 그 어린아이의 남성적인 욕망을.
손세미: (숨을 헐떡이며) 내가… 내가 그랬을지도 모른다고? 아니, 그때 난… 그저… 창환이가 상처받지 않기를 바랐을 뿐이야. 창환이는 그때 고3이었고… 내가 혹여라도 그의 수험생활에 방해가 될까 봐… 그 아이를 보듬어줘야 한다는 교육적 사명감이 더 컸어. 그래서… 그래서 채 10분도 지나지 않아… 우리가 얄팍한 달빛이 스며드는 침대 위에서 서로의 온기를 나누게 된 거야.
장윤영: (날카롭게 파고들며) '교육적 사명감' 때문에 열아홉 살 제자랑 침대에 누웠다? 스물일곱 살에? 언니, 75D컵 가슴이 '교육적 사명감' 때문에 마구 흔들린다고 생각했어요? 침대에 누워 언니 마음속 깊이 자리한 수치심과 함께, 화가 풀린 듯 보였던 그 아이를 조심스럽게 바라보면서… 언니는 이미 다 준비가 되어 있었던 거잖아요. 떨리는 손으로 제 옷깃을 풀어헤치고, 수줍지만 결연하게, 그리고 아주 서서히 다리를 벌렸다고 했죠? 그 아이가 언니의 은밀한 곳에 다가갈 때… 이미 촉촉하게 젖어들고 있었다고, 솔직히 고백했잖아요.
손세미: (고개를 저으며) 아니야… 아니야… 그건… 그건 창환이의 수험생활 고통과 나에 대한 배신감을 치유해 줄 수 있는 유일한 '교육적 섬김'이라고 믿었어. 난… 난 그저 선생님으로서… 최선을 다한 것뿐이야. 내가… 내 입술 사이로 흘러나온 그 고백… “창환아… 선생님이 선물 줄게. 해도 돼.” 그게 내 인생에서 가장 수치스럽고도 아찔한 선언이었지만… 그게 그 아이를 위한 길이라고 생각했어. 그리고… 창환이의 그 뜨겁고 압도적인 존재감이… 내 은밀한 안식처를 단 한 치의 오차도 없이 가득 채웠을 때… 난 그게 단순히 육체가 섞이는 통속적인 행위가 아님을 깨달았어. 내 안의 빈틈을 꽉 채워버리는 그 단단하고 두꺼운 실체를 느끼며… 이건… '하나가 된다'는 영적인 합일임을 직감했지.
장윤영: (낄낄거리며) 영적인 합일이요? 스물일곱 먹은 여선생님의 처녀를 빼앗은 열아홉 살 제자와의요? 하! 언니, 언니 몸의 모든 세포가 터져버릴 것처럼 팽창하며 알 수 없는 비명을 지를 때, 언니의 그 야릇한 표정을 창환이가 똑똑히 봤다는 게 더 문제 아닌가요? 정숙한 여교사라면서, 제자의 야수 같은 표정과 벌거벗은 몸을 마주할 자신이 없어서 얼굴을 가렸다? 그러면서 손가락 사이로 비치는 그 아이의 땀방울 맺힌 근육질 몸매와, 그 어느 때보다 남자다운 그의 표정이 잊히지 않았다고 했죠? 그때 언니는 이미 '오빠'라 부르고 싶어 했을 거예요. 어린 고등학생이 아니라… 어마어마한 남자를 만난 기분이었을 거고요. 안 그래요?
손세미: (흐느끼며) 흐읍… 맞아… 맞아… 그 순간만큼은… 정말 ‘오빠’라 불러도 이상하지 않을 것 같았어. 창환이의 거칠고 단단한 피스톤 운동이 시작되었을 때, 난 내가 알던 세상이 송두리째 무너져 내리는 것을 느꼈어. 75D컵의 내 가슴이 격렬하게 흔들리며 침대 시트를 적실 때, 내 안의 '손세미'는 어디론가 사라지고 오직 본능에 충실한 한 여자만 남았어. 얼마나 좋았는지… 그 감각을 어떻게 언어로 다 표현할 수 있을까? 그건 마치 굳게 닫혀있던 성소(聖所)의 문을 거대한 황금 열쇠로 강제로 열어젖히는 듯한 압도적인 쾌락이었어. 그리고… 무엇보다 날 당황하게 했던 건… 평소의 나라면 상상도 못 했을 내 입술의 배신이었어.
장윤영: (미소 지으며) 아, 드디어 본색을 드러내시네요. 창환이가 언니 허리를 힘껏 놀리면서, 귓가에 짐승 같은 목소리로 음탕하게 속삭였다면서요? “그 형이... 손세미 쌤이 이런 여자인 거 알아?” 그때 언니 이성은 이미 마비되어 있었죠. 신음 섞인 목소리로 뭐라고 답했더라? “아니... 몰라... 그 오빠는 손세미를 아무것도 몰라... 아앗!” 맞죠? 그리고 그 아이가 더 거칠게 언니 안을 파고들며 몰아세웠을 때… “그 형이 좋아? 아니면 자지 큰 최창환이 좋아? 응? 대답해봐요!” 이 천박하고 노골적인 질문에, 언니는 뭐라고 외쳤어요? 제 영혼까지 다 내어준 듯한 목소리로?
손세미: (고개를 파묻으며) 흐읍… 창환이가… 창환이가 좋아… 창환이… 자지 좋아! 최창환 자지 좋아아…! 그렇게 외쳤어… 그리고 그 순간… 난 깨달았어. 아, 나는 원래 이런 여자였을지도 모르겠다고. 단단한 근육질 체격에서 뿜어져 나오는 그 압도적인 힘에 맞춰 내 몸이 스스로를 조였다 풀었다 하는 그 생경한 감각… 내 입에서 나오는 게 신음인지, 아니면 억눌렸던 자아의 해방인지 알 수 없었어. 연달아 두 번이나 찾아온 절정의 끝에서 난 결국 눈물까지 흘리고 말았어. 하체는 내 의지와 상관없이 덜덜 떨리고 있었고, 내 은밀한 곳은 창환이가 남긴 뜨거운 결실들로 가득 차 있었지. ‘속궁합’이라는 게 이토록 무섭고, 인간의 이성이란 게 이토록 무력한 것인지 예전엔 미처 몰랐어. 그 날이… 스물일곱 살에… 내가 최창환에게 처녀를 열납한 날이었으니까. 내 첫 경험이… 그렇게 황홀해도 되는 건지… 나는… 나는 결국 그 날 카카오톡 프로필 메시지를 바꿨어. ‘일곱 번째 여성’이라고. 최창환에게 자신의 몸을 허락한 지금까지 여섯 명의 또래 여성들 다음, 내가 무려 처녀를 허락한 일곱 번째 여성이 된 거야. 그 뜻을 아는 건 최창환과 나밖에 없겠지…

[인터뷰 후일담]
윤영이의 날카로운 질문들을 들으면서, 그날 밤 창환이와 내가 겪었던 모든 순간들이 다시 선명하게 떠올랐어요. 솔직히 말해서… 처음에는 정말 창피하고 수치스러워서 땅속으로 숨고 싶었어. 내가 스물일곱이나 먹은 여선생인데, 고작 열아홉 살 제자에게 그렇게 속절없이 무너져 내린 게 말이야. '교육적 섬김'이니 '영적인 합일'이니 하는 말들로 나 자신을 얼마나 합리화했는지… 윤영이의 질문들이 비수처럼 박혀서, 내가 애써 외면했던 본심을 자꾸만 끄집어내는 것 같았어.
하지만 이상하게도… 마음 한편으로는 후련함도 느껴져. 그래, 나는 원래 이런 여자였을지도 몰라. 겉으로는 정숙하고 단아한 손세미였지만, 내 안에는 뜨거운 욕망과 금기된 쾌락을 갈구하는 또 다른 내가 숨어 있었던 거야. 창환이의 거친 손길과 압도적인 힘이 그걸 일깨워준 거지. 윤영이의 말처럼, 나는 그 아이에게 단순한 선생님이 아니라, '여성'으로서 인정받고 싶었던 것 같아. 그 아이의 질투를 은근히 즐겼고, 그의 집착에 짜릿함을 느꼈어. 내가 처녀를 바치면서까지 그 아이를 '일곱 번째 여성'으로 명명한 것도… 어쩌면 창환이를 향한 나의, 표현할 수 없는 사랑의 방식이었는지도 모르겠어.
정말… 나는 최창환을 너무나도 사랑했어. 그 아이가 내 안에 들어왔을 때 느꼈던 그 영혼의 합일감은, 단순히 육체적인 쾌락을 넘어선 것이었으니까. 아직도 그 날의 뜨거운 기억들이 내 몸 깊숙이 박혀 있는 것 같아. 윤영이에게 이런 이야기들을 털어놓으면서, 내가 창환이를 얼마나 깊이 사랑했는지, 그리고 그와의 관계가 내게 어떤 의미였는지 비로소 깨닫게 되는 것 같아.
아직도 내 마음속에는 미처 다 헤아리지 못한 감정들이 많아. 윤영이와 대화를 계속 이어가봐야겠어. 이 비밀스러운 카페의 언니들도… 어쩌면 나와 비슷한 경험을 했을지 모르잖아? 내 이야기를 듣고 어떤 생각을 할지… 벌써부터 궁금하다.

        let currentIndex = 0;
        let sizeLevel = 2; 
        let leadingLevel = 1; 

        const sizeLabels = ['S', 'M', 'L', 'XL', 'XXL'];
        const leadingLabels = ['좁게', '기본', '넓게'];

        function updateTypography() {
            const targets = document.querySelectorAll('.readable-text');
            targets.forEach(el => {
                for (let i = 0; i < 5; i++) el.classList.remove(`text-size-${i}`);
                for (let i = 0; i < 3; i++) el.classList.remove(`leading-step-${i}`);
                
                el.classList.add(`text-size-${sizeLevel}`);
                el.classList.add(`leading-step-${leadingLevel}`);
            });

            const sizeLabel = sizeLabels[sizeLevel];
            const leadingLabel = leadingLabels[leadingLevel];
            
            document.getElementById('size-indicator').textContent = sizeLabel;
            document.getElementById('leading-indicator').textContent = leadingLabel;
            
            if (document.getElementById('size-indicator-mobile')) {
                document.getElementById('size-indicator-mobile').textContent = sizeLabel;
                document.getElementById('leading-indicator-mobile').textContent = leadingLabel;
            }
        }

        function updateSize(step) {
            sizeLevel = Math.max(0, Math.min(4, sizeLevel + step));
            updateTypography();
        }

        function updateLeading(step) {
            leadingLevel = Math.max(0, Math.min(2, leadingLevel + step));
            updateTypography();
        }

        function toggleMobileControls() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function render() {
            const ep = episodes[currentIndex];
            document.getElementById('post-title').textContent = ep.title;
            
            const formattedInterview = beautifyInterviewText(ep.mainText);
            document.getElementById('main-text').innerHTML = formattedInterview;
            
            const cafeHtml = marked.parse(ep.cafeComments, { breaks: true })
                .replace(/<hr>/g, '<div class="comment-divider"></div>');
            document.getElementById('cafe-comments').innerHTML = cafeHtml;
            
            document.getElementById('church-comments').innerHTML = parseChurchComments(ep.churchComments);
            
            // 기존 네비게이션 표시 업데이트
            document.getElementById('page-indicator').textContent = `${currentIndex + 1} / ${episodes.length}`;
            document.getElementById('btn-prev').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next').style.visibility = currentIndex === episodes.length - 1 ? 'hidden' : 'visible';

            // 플로팅 네비게이션 업데이트
            document.getElementById('float-page-indicator').textContent = `${currentIndex + 1} / ${episodes.length}`;
            const floatPrev = document.getElementById('float-prev');
            const floatNext = document.getElementById('float-next');
            if (currentIndex === 0) {
                floatPrev.style.opacity = '0.3';
                floatPrev.style.pointerEvents = 'none';
            } else {
                floatPrev.style.opacity = '1';
                floatPrev.style.pointerEvents = 'auto';
            }
            if (currentIndex === episodes.length - 1) {
                floatNext.style.opacity = '0.3';
                floatNext.style.pointerEvents = 'none';
            } else {
                floatNext.style.opacity = '1';
                floatNext.style.pointerEvents = 'auto';
            }

            lucide.createIcons();
            updateTypography();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigate(dir) {
            currentIndex += dir;
            render();
        }

        window.onload = render;
    </script>
</body>

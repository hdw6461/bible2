10 여호와께서 이르시되 네가 수고도 아니하였고 재배도 아니하였고 하룻밤에 났다가 하룻밤에 말라 버린 이 박 넝쿨을 아꼈거든 
11 하물며 이 큰 성읍 니느웨에는 좌우를 분변하지 못하는 자가 십이만여 명이요 가축도 많이 있나니 내가 어찌 아끼지 아니하겠느냐 하시니라


미가

4:1-2 (이방인의 회복)
1 끝날에 이르러는 여호와의 전의 산이 산들의 꼭대기에 굳게 서며 작은 산들 위에 뛰어나고 민족들이 그리로 몰려갈 것이라 
2 곧 많은 이방 사람들이 가며 이르기를 오라 우리가 여호와의 산에 올라가서 야곱의 하나님의 전에 이르자 그가 그의 도를 가지고 우리에게 가르치실 것이니라 우리가 그의 길로 행하리라 하리니 이는 율법이 시온에서부터 나올 것이요 여호와의 말씀이 예루살렘에서부터 나올 것임이라 

5:2 (메시아 탄생지)
베들레헴 에브라다야 너는 유다 족속 중에 작을지라도 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라 그의 근본은 상고에, 영원에 있느니라

6:7-8 (여호와가 기뻐하시는 것)
7 여호와께서 천천의 숫양이나 만만의 강물 같은 기름을 기뻐하실까 내 허물을 위하여 내 맏아들을, 내 영혼의 죄로 말미암아 내 몸의 열매를 드릴까 
8 사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 여호와께서 네게 구하시는 것은 오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것이 아니냐 


나훔

1:2-3 (하나님의 진노)
2 여호와는 질투하시며 보복하시는 하나님이시니라 여호와는 보복하시며 진노하시되 자기를 거스르는 자에게 여호와는 보복하시며 자기를 대적하는 자에게 진노를 품으시며 
3 여호와는 노하기를 더디 하시며 권능이 크시며 벌 받을 자를 결코 내버려두지 아니 하시느니라 여호와의 길은 회오리바람과 광풍에 있고 구름은 그의 발의 티끌이로다


하박국

2:4 (의인과 믿음)
보라 그의 마음은 교만하며 그 속에서 정직하지 못하나 의인은 그의 믿음으로 말미암아 살리라 

2:14 (여호와의 영광)
이는 물이 바다를 덮음 같이 여호와의 영광을 인정하는 것이 세상에 가득함이니라 


스바냐

3:17 (여호와의 기쁨)
너의 하나님 여호와가 너의 가운데에 계시니 그는 구원을 베푸실 전능자이시라 그가 너로 말미암아 기쁨을 이기지 못하시며 너를 잠잠히 사랑하시며 너로 말미암아 즐거이 부르며 기뻐하시리라 하리라 


학개

2:6-7 (시온의 회복)
6 만군의 여호와가 이같이 말하노라 조금 있으면 내가 하늘과 땅과 바다와 육지를 진동시킬 것이요 
7 또한 모든 나라를 진동시킬 것이며 모든 나라의 보배가 이르리니 내가 이 성전에 영광이 충만하게 하리라 만군의 여호와의 말이니라 


스가랴

3:8-9 (메시아의 대속)
8 대제사장 여호수아야 너와 네 앞에 앉은 네 동료들은 내 말을 들을 것이니라 이들은 예표의 사람들이라 내가 내 종 싹을 나게 하리라 
9 만군의 여호와가 말하노라 내가 너 여호수아 앞에 세운 돌을 보라 한 돌에 일곱 눈이 있느니라 내가 거기에 새길 것을 새기며 이 땅의 죄악을 하루에 제거하리라 

4:6, 9 (성전 재건과 성령)
6 그가 내게 대답하여 이르되 여호와께서 스룹바벨에게 하신 말씀이 이러하니라 만군의 여호와께서 말씀하시되 이는 힘으로 되지 아니하며 능력으로 되지 아니하고 오직 나의 영으로 되느니라 
9 스룹바벨의 손이 이 성전의 기초를 놓았은즉 그의 손이 또한 그 일을 마치리라 하셨나니 만군의 여호와께서 나를 너희에게 보내신 줄을 네가 알리라 하셨느니라

9:9 (메시아 왕의 오심)
시온의 딸아 크게 기뻐할지어다 예루살렘의 딸아 즐거이 부를지어다 보라 네 왕이 네게 임하시나니 그는 공의로우시며 구원을 베푸시며 겸손하여서 나귀를 타시나니 나귀의 작은 것 곧 나귀 새끼니라 

13:7 (목자를 침)
만군의 여호와가 말하노라 칼아 깨어서 내 목자, 내 짝 된 자를 치라 목자를 치면 양이 흩어지려니와 작은 자들 위에는 내가 내 손을 드리우리라 



말라기

3:1 (메시아 오심을 예비)
만군의 여호와가 이르노라 보라 내가 내 사자를 보내리니 그가 내 앞에서 길을 준비할 것이요 또 너희가 구하는 바 주가 갑자기 그의 성전에 임하시리니 곧 너희가 사모하는 바 언약의 사자가 임하실 것이라 

4:2 (여호와의 공의와 치료)
내 이름을 경외하는 너희에게는 공의로운 해가 떠올라서 치료하는 광선을 비추리니 너희가 나가서 외양간에서 나온 송아지 같이 뛰리라 

4:5 (엘리야를 보냄)
보라 여호와의 크고 두려운 날이 이르기 전에 내가 선지자 엘리야를 너희에게 보내리니 


마태복음 

1:21 (예수의 뜻)
아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 그들의 죄에서 구원할 자이심이라 하니라 

1:23 (그리스도의 동정녀 탄생)
보라 처녀가 잉태하여 아들을 낳을 것이요 그의 이름은 임마누엘이라 하리라 하셨으니 이를 번역한즉 하나님이 우리와 함께 계시다 함이라

5:3-5 (팔복)  
3 심령이 가난한 자는 복이 있나니 천국이 그들의 것임이요

5 온유한 자는 복이 있나니 그들이 땅을 기업으로 받을 것임이요 

5:16 (천국 백성의 선행)
이같이 너희 빛이 사람 앞에 비치게 하여 그들로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라 

5:44-45 (원수 사랑)

6:3-4 (은밀한 구제)

6:33 (먼저 구할 것)  
그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라 

7:12 (황금률) 
그러므로 무엇이든지 남에게 대접을 받고자 하는 대로 너희도 남을 대접하라 이것이 율법이요 선지자니라 

16:16 (베드로의 신앙고백) 
시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다 

28:18-20 (지상명령. 세례와 삼위일체)
18 예수께서 나아와 말씀하여 이르시되 하늘과 땅의 모든 권세를 내게 주셨으니 
19 그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 
20 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라 


마가복음 

8:35 (순교 신앙)
누구든지 자기 목숨을 구원하고자 하면 잃을 것이요 누구든지 나와 복음을 위하여 자기 목숨을 잃으면 구원하리라 
  
10:45 (인자의 온 목적)

요한복음 

1:12-13 (하나님의 자녀 되는 권세)

13 이는 혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로부터 난 자들이니라 

1:14 (성육신)  
말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라 

3:5 (중생)
예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라 

3:16 (하나님의 사랑)
하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라 

5:24 (영생을 얻음) 
내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라 

6:35 (생명의 떡)

11:25-26 (부활과 생명 되신 예수님)

26 무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐 

14:6 (그리스도의 유일성)
예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라 

17:3 (영생의 정의) 
영생은 곧 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 아는 것이니이다 

20:31 (요한복음을 기록한 목적) 
오직 이것을 기록함은 너희로 예수께서 하나님의 아들 그리스도이심을 믿게 하려 함이요 또 너희로 믿고 그 이름을 힘입어 생명을 얻게 하려 함이니라 


사도행전  

1:8 (성령과 복음 전파)
오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라 

4:12 (그리스도의 유일성) 
다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라 

20:24 (사도 바울의 사명 의식)

로마서 

1:16 (하나님의 능력 된 복음)
내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 먼저는 유대인에게요 그리고 헬라인에게로다 

3:23-24 (그리스도 예수 안에 있는 속량)  
23 모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니 
24 그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값없이 의롭다 하심을 얻은 자 되었느니라 

5:1 (이신칭의의 결과)

5:8 (하나님의 사랑 확증) 
우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라  

6:13 (의의 무기)

8:1-2 (정죄함이 없음) 
1 그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니 
2 이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라 

8:15 (양자의 영) 
너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라 

10:9-10 (구원에 이르는 믿음)

10 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라 

11:36 (하나님께 영광)

요한계시록 

3:20 (예수님의 초청)
볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라 
        `;

        let verses = [];
        let currentIndex = 0;
        let isBlurred = false;

        // 텍스트 파싱 로직
        function parseVerses(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            let currentBook = "";
            let parsedVerses = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.match(/^[가-힣]+$/) && !line.includes("암송구절")) {
                    currentBook = line;
                    continue;
                }

                if (line.match(/^\d+:\d+/)) {
                    const refMatch = line.match(/^(\d+:\d+[-\d]*)\s*\((.*)\)/);
                    const ref = refMatch ? refMatch[1] : line.split(' ')[0];
                    const title = refMatch ? refMatch[2] : "";
                    
                    let content = "";
                    let j = i + 1;
                    while (j < lines.length && !lines[j].match(/^\d+:\d+/) && !lines[j].match(/^[가-힣]+$/)) {
                        content += lines[j] + " ";
                        j++;
                    }
                    
                    parsedVerses.push({
                        book: currentBook,
                        reference: ref,
                        title: title,
                        content: content.trim()
                    });
                    i = j - 1;
                }
            }
            return parsedVerses;
        }

        function init() {
            verses = parseVerses(rawData);
            
            const books = [...new Set(verses.map(v => v.book))];
            const filter = document.getElementById('bookFilter');
            books.forEach(book => {
                const opt = document.createElement('option');
                opt.value = book;
                opt.textContent = book;
                filter.appendChild(opt);
            });

            // 초기 표시
            updateDisplay(0);
            renderList();

            // 이벤트 리스너
            document.getElementById('randomBtn').addEventListener('click', displayRandomVerse);
            document.getElementById('prevBtn').addEventListener('click', () => navigateVerse(-1));
            document.getElementById('nextBtn').addEventListener('click', () => navigateVerse(1));
            document.getElementById('toggleBlurBtn').addEventListener('click', toggleBlur);
            document.getElementById('bookFilter').addEventListener('change', () => {
                currentIndex = 0;
                updateDisplay(0);
                renderList();
            });
        }

        function getFilteredVerses() {
            const filterVal = document.getElementById('bookFilter').value;
            return filterVal === 'all' ? verses : verses.filter(v => v.book === filterVal);
        }

        function updateDisplay(index) {
            const filtered = getFilteredVerses();
            if (filtered.length === 0) return;

            // 인덱스 범위 조정 (순환)
            if (index >= filtered.length) index = 0;
            if (index < 0) index = filtered.length - 1;
            
            currentIndex = index;
            const v = filtered[currentIndex];
            
            document.getElementById('verseReference').textContent = `${v.book} ${v.reference}`;
            document.getElementById('verseTitle').textContent = v.title ? `[${v.title}]` : "";
            document.getElementById('verseBody').textContent = v.content;
            
            applyBlur();
        }

        function navigateVerse(direction) {
            updateDisplay(currentIndex + direction);
        }

        function displayRandomVerse() {
            const filtered = getFilteredVerses();
            if (filtered.length === 0) return;
            const randomIndex = Math.floor(Math.random() * filtered.length);
            updateDisplay(randomIndex);
        }

        function toggleBlur() {
            isBlurred = !isBlurred;
            const btn = document.getElementById('toggleBlurBtn');
            btn.textContent = isBlurred ? "🔓 해제" : "👁️ 가리기";
            applyBlur();
        }

        function applyBlur() {
            const bodyEl = document.getElementById('verseBody');
            const listContents = document.querySelectorAll('.list-content');
            
            if (isBlurred) {
                bodyEl.classList.add('hidden-content');
                listContents.forEach(el => el.classList.add('hidden-content'));
            } else {
                bodyEl.classList.remove('hidden-content');
                listContents.forEach(el => el.classList.remove('hidden-content'));
            }
        }

        function renderList() {
            const filtered = getFilteredVerses();
            const listContainer = document.getElementById('verseList');
            
            listContainer.innerHTML = '';
            
            filtered.forEach((v, index) => {
                const item = document.createElement('div');
                item.className = "bg-white p-5 rounded-lg shadow-sm border border-gray-100 hover:border-indigo-200 transition cursor-pointer";
                item.onclick = () => {
                    updateDisplay(index);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                
                item.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-indigo-600">${v.book} ${v.reference}</span>
                        <span class="text-xs text-gray-400 font-medium">${v.title}</span>
                    </div>
                    <p class="text-gray-700 text-sm list-content ${isBlurred ? 'hidden-content' : ''}">${v.content}</p>
                `;
                listContainer.appendChild(item);
            });
        }

        window.onload = init;
    </script>

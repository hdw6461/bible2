<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 암송 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
        body {
            font-family: 'Noto Serif KR', serif;
            background-color: #f8f9fa;
        }
        .verse-content {
            line-height: 2;
            transition: all 0.3s ease;
        }
        .hidden-all {
            filter: blur(10px);
            user-select: none;
        }
        .hidden-all:hover {
            filter: blur(0);
        }
        .word-blank {
            background-color: #e2e8f0;
            color: transparent;
            border-bottom: 2px solid #6366f1;
            padding: 0 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .word-blank:hover {
            background-color: #f1f5f9;
            color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">📖 성경 암송 도우미</h1>
            <p class="text-gray-600 italic">"주의 말씀을 내 마음에 두었나이다"</p>
        </header>

        <!-- Controls -->
        <div class="flex flex-wrap gap-2 mb-8 justify-center">
            <button id="prevBtn" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg font-bold shadow-sm transition">
                ⬅️
            </button>
            <button id="randomBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow-md transition">
                🎲 랜덤
            </button>
            <button id="nextBtn" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg font-bold shadow-sm transition">
                ➡️
            </button>
            <div class="h-8 w-px bg-gray-300 mx-1 self-center"></div>
            <button id="toggleBlurBtn" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg font-bold transition shadow-sm">
                👁️ 전체 가리기
            </button>
            <button id="toggleWordBtn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-lg font-bold transition shadow-sm border border-indigo-200">
                ✏️ 단어 가리기
            </button>
            <select id="bookFilter" class="bg-white border border-gray-300 px-3 py-2 rounded-lg text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="all">전체</option>
            </select>
        </div>

        <!-- Verse Display Card -->
        <div id="verseCard" class="bg-white rounded-2xl shadow-xl p-8 md:p-12 mb-8 border border-gray-100 min-h-[350px] flex flex-col justify-center text-center relative overflow-hidden">
            <div id="verseReference" class="text-indigo-600 font-bold text-2xl mb-2">데이터 로딩 중...</div>
            <div id="verseTitle" class="text-gray-400 text-sm mb-8 font-medium"></div>
            <div id="verseBody" class="verse-content text-gray-800 text-xl md:text-2xl font-medium break-keep whitespace-pre-wrap">
                텍스트 데이터를 분석하고 있습니다.
            </div>
        </div>

        <!-- List View -->
        <div class="mt-12">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
                구절 목록 <span id="verseCount" class="text-sm font-normal text-gray-500"></span>
            </h2>
            <div id="verseList" class="space-y-4"></div>
        </div>
    </div>

    <script>
        // 텍스트 소스 (사용자 업로드 데이터 기준)
        const rawData = `
창세기

3:15 (원시복음, 창세기 주제)
내가 너로 여자와 원수가 되게 하고 네 후손도 여자의 후손과 원수가 되게 하리니 여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라 하시고 

12:1-2 (하나님의 부름과 약속)
1 여호와께서 아브람에게 이르시되 너는 너의 고향과 친척과 아버지의 집을 떠나 내가 네게 보여 줄 땅으로 가라 
2 내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라 

12:1, 3 (복합 구절 예시)
1 내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라
3 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 땅의 모든 족속이 너로 말미암아 복을 얻을 것이라 하신지라

22:12 (하나님 경외)
사자가 이르시되 그 아이에게 네 손을 대지 말라 그에게 아무 일도 하지 말라 네가 네 아들 네 독자까지도 내게 아끼지 아니하였으니 내가 이제야 네가 하나님을 경외하는 줄을 아노라

베드로후서 

3:18 (그리스도의 은혜와 그를 아는 지식)  
오직 우리 주 곧 구주 예수 그리스도의 은혜와 그를 아는 지식에서 자라 가라 영광이 이제와 영원한 날까지 그에게 있을지어다 

요한일서 

2:1-2 (대언자 예수 그리스도) 
1 나의 자녀들아 내가 이것을 너희에게 씀은 너희로 죄를 범하지 않게 하려 함이라 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라 
2 그는 우리 죄를 위한 화목제물이니 우리만 위할 뿐 아니요 온 세상의 죄를 위하심이라  
 
3:4 (죄란 무엇인가?)
죄를 짓는 자마다 불법을 행하나니 죄는 불법이라 

5:13 (우리에게 영생이 있음) 
내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓰는 것은 너희로 하여금 너희에게 영생이 있음을 알게 하려 함이라
        `;

        let verses = [];
        let currentIndex = 0;
        let isAllBlurred = false;
        let isWordHidden = false;

        // 개선된 텍스트 파싱 로직
        function parseVerses(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentBook = "";
            let parsed = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // 책 이름 판별 (한글로만 구성되었거나 특정 키워드가 없는 경우)
                if (line.match(/^[가-힣]+$/) && !line.includes("암송")) {
                    currentBook = line;
                    continue;
                }

                // 장:절 패턴 (12:1-2 또는 12:1, 3 지원)
                const refRegex = /^(\d+:\d+([,-]\s*\d+)*)\s*(\(.*\))?/;
                const match = line.match(refRegex);

                if (match) {
                    const reference = match[1];
                    const title = match[3] ? match[3].replace(/[()]/g, '') : "";
                    
                    let contentLines = [];
                    let j = i + 1;
                    while (j < lines.length && !lines[j].match(/^\d+:\d+/) && !lines[j].match(/^[가-힣]+$/)) {
                        // 내용 중 숫자 제거 (절 표시 숫자 제거)
                        let cleanLine = lines[j].replace(/^\d+\s+/, '').trim();
                        if (cleanLine) contentLines.push(cleanLine);
                        j++;
                    }
                    
                    parsed.push({
                        book: currentBook,
                        reference: reference,
                        title: title,
                        content: contentLines.join('\n') // 절 숫자를 빼고 줄바꿈으로 연결
                    });
                    i = j - 1;
                }
            }
            return parsed;
        }

        // 단어 가리기 처리 함수
        function processWordHiding(text) {
            if (!isWordHidden) return text;

            // 명사 위주 혹은 3글자 이상의 단어를 랜덤하게 가림
            const words = text.split(/(\s+)/);
            return words.map(word => {
                // 공백이 아니고, 일정 확률(30%)로 단어를 가림 (단, 2글자 이상)
                if (word.trim().length >= 2 && Math.random() > 0.7) {
                    return `<span class="word-blank">${word}</span>`;
                }
                return word;
            }).join('');
        }

        function updateDisplay(index) {
            const filtered = getFilteredVerses();
            if (filtered.length === 0) return;

            if (index >= filtered.length) index = 0;
            if (index < 0) index = filtered.length - 1;
            
            currentIndex = index;
            const v = filtered[currentIndex];
            
            document.getElementById('verseReference').textContent = `${v.book} ${v.reference}`;
            document.getElementById('verseTitle').textContent = v.title ? `[${v.title}]` : "";
            
            const bodyEl = document.getElementById('verseBody');
            if (isWordHidden) {
                bodyEl.innerHTML = processWordHiding(v.content);
            } else {
                bodyEl.textContent = v.content;
            }
            
            applyState();
        }

        function getFilteredVerses() {
            const val = document.getElementById('bookFilter').value;
            return val === 'all' ? verses : verses.filter(v => v.book === val);
        }

        function applyState() {
            const bodyEl = document.getElementById('verseBody');
            if (isAllBlurred) {
                bodyEl.classList.add('hidden-all');
            } else {
                bodyEl.classList.remove('hidden-all');
            }
        }

        function init() {
            verses = parseVerses(rawData);
            
            const filter = document.getElementById('bookFilter');
            const books = [...new Set(verses.map(v => v.book))];
            books.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                filter.appendChild(opt);
            });

            document.getElementById('verseCount').textContent = `(총 ${verses.length}구절)`;

            updateDisplay(0);
            renderList();

            // Events
            document.getElementById('randomBtn').onclick = () => updateDisplay(Math.floor(Math.random() * getFilteredVerses().length));
            document.getElementById('prevBtn').onclick = () => updateDisplay(currentIndex - 1);
            document.getElementById('nextBtn').onclick = () => updateDisplay(currentIndex + 1);
            
            document.getElementById('toggleBlurBtn').onclick = function() {
                isAllBlurred = !isAllBlurred;
                if (isAllBlurred) isWordHidden = false; // 한 번에 하나만 활성
                this.classList.toggle('bg-slate-700', !isAllBlurred);
                this.classList.toggle('bg-red-500', isAllBlurred);
                this.textContent = isAllBlurred ? "🔓 가리기 해제" : "👁️ 전체 가리기";
                updateDisplay(currentIndex);
            };

            document.getElementById('toggleWordBtn').onclick = function() {
                isWordHidden = !isWordHidden;
                if (isWordHidden) isAllBlurred = false;
                this.classList.toggle('bg-indigo-100', !isWordHidden);
                this.classList.toggle('bg-indigo-600', isWordHidden);
                this.classList.toggle('text-white', isWordHidden);
                updateDisplay(currentIndex);
            };

            document.getElementById('bookFilter').onchange = () => {
                currentIndex = 0;
                updateDisplay(0);
                renderList();
            };
        }

        function renderList() {
            const filtered = getFilteredVerses();
            const container = document.getElementById('verseList');
            container.innerHTML = '';
            
            filtered.forEach((v, idx) => {
                const item = document.createElement('div');
                item.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:border-indigo-300 transition cursor-pointer";
                item.onclick = () => {
                    updateDisplay(idx);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-indigo-600">${v.book} ${v.reference}</span>
                        <span class="text-xs text-gray-400">${v.title}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
